/* 機能3: スペクトラム＋反射＋ピークホールド */
let _specSm = null, _specPk = null;
function vizSpectrumReflect(x,y,w,h,f){
  const n = Math.floor(w/6);
  if(!_specSm || _specSm.length !== n){ _specSm = new Float32Array(n); _specPk = new Float32Array(n); }
  const data = getSpectrum(n);
  const mid = y + Math.floor(h*0.68);
  const barH = Math.floor(h*0.60);
  for(let i=0;i<n;i++){
    const target = data[i];
    _specSm[i] = target > _specSm[i] ? target : _specSm[i]*0.85;
    const v = _specSm[i];
    const bh = Math.max(0, Math.floor(v*barH));
    const bx = x + i*6;
    for(let j=0;j<bh;j++){
      const yy = mid-1-j;
      const c = j > barH*0.7 ? 4 : (j > barH*0.4 ? 6 : 3);
      for(let k=0;k<5;k++) px(bx+k, yy, c);
    }
    for(let j=0;j<Math.floor(bh*0.55);j++){
      const yy = mid+1+j;
      for(let k=0;k<5;k++) px(bx+k, yy, j > 6 ? 1 : 2);
    }
    if(target > _specPk[i]) _specPk[i] = target;
    else _specPk[i] = Math.max(0, _specPk[i] - 0.008);
    const py = mid-1-Math.floor(_specPk[i]*barH);
    for(let k=0;k<5;k++) px(bx+k, py, 7);
  }
  hline(x, mid, w, 1);
}

/* 機能4: 3D棒グラフEQ */
function viz3DBars(x,y,w,h,f){
  const n = 20, depth = 4;

  const baseY = y + h - 3;
  for(let i=0;i<n;i++){

    const bh = Math.max(2, Math.floor(v*(h-14)));

    for(let j=0;j<bh;j++){
      const yy = baseY - j;
      const c = j > bh*0.7 ? 4 : (j > bh*0.4 ? 6 : 3);
      for(let k=0;k<bw-4;k++) px(bx+k, yy, c);
    }
    for(let d=1;d<=depth;d++){
      for(let k=0;k<bw-4;k++) px(bx+k+d, baseY-bh-d, 7);
    }
    for(let j=0;j<bh;j++){
      const yy = baseY - j;

/* 機能5: 回転ワイヤーフレームロゴ */
function vizLogo3D(x,y,w,h,f){
  if(!vizLogo3D.pts){
    const saved = new Uint8Array(fb);
    clearFB(0);
    drawTextBigCenter('PAAUDIO', W>>1, 35, 3, 2, 1);
    const pts = [];
    for(let yy=0;yy<H;yy++) for(let xx=0;xx<W;xx++){
      if(fb[Math.floor(yy*SCALE)*PW + Math.floor(xx*SCALE)])
        pts.push({x:xx-W/2, y:yy-H/2});
    }
    fb.set(saved);
    vizLogo3D.pts = pts;
  }
  const cx = x+w/2, cy = y+h/2;
  const a = f*0.035;
  const cos = Math.cos(a), sin = Math.sin(a);
  const s = (w/W)*0.95;
  for(const p of vizLogo3D.pts){
    const rx = p.x*cos;
    const z = p.x*sin;
    const depth = 1 + z*0.006;
    if(depth < 0.35) continue;
    px(cx + rx*s*depth, cy + p.y*(h/H)*0.95*depth,
       depth > 1.15 ? 3 : (depth > 0.75 ? 2 : 1));
  }
}

/* 機能6: 回転CD（斜めから見た円盤） */
function vizCD(x,y,w,h,f){
  const cx = x+w/2, cy = y+h/2;
  const R = Math.min(h*0.42, w*0.22);
  const playing = isPlaying && !audioEl.paused;
  const rot = playing ? f*0.05 : 0;
  const tiltY = 0.30;
  for(let a=0;a<Math.PI*2;a+=0.015){
    px(cx+Math.cos(a)*R, cy+Math.sin(a)*R*tiltY, 1);
  }
  for(let rr=4; rr<R; rr+=4){
    for(let a=0;a<Math.PI*2;a+=0.06){
      px(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*tiltY, 1);
    }
  }
  for(let a=0;a<Math.PI*2;a+=0.25){
    px(cx+Math.cos(a)*2, cy+Math.sin(a)*2, 3);
    px(cx+Math.cos(a)*1, cy+Math.sin(a)*1, 3);
  }
  // 光沢スイープ
  for(let i=0;i<60;i++){
    const a1 = rot + i*0.04;
    const rr = R*(0.35 + i/100);
    px(cx+Math.cos(a1)*rr, cy+Math.sin(a1)*rr*tiltY, i<6?7:3);
    const a2 = rot + Math.PI + i*0.04;
    px(cx+Math.cos(a2)*rr, cy+Math.sin(a2)*rr*tiltY, i<6?7:2);
  }
  drawTextCenter(playing ? 'PLAY' : 'PAUSE', cx, y+h-11, playing?5:2);
}

/* 機能7: 疑似3D地形フライト */
function vizTerrain(x,y,w,h,f){
  const horizon = y + Math.floor(h*0.35);
  const N = 16, rows = 10, cols = 24;
  const data = getSpectrum(N);
  const phase = f*0.25;
  hline(x, horizon, w, 1);
  for(let r=rows-1; r>=0; r--){
    const z = (r+1)/rows;
    const yy = horizon + Math.floor((h-(horizon-y)) * Math.pow(z, 1.8));
    const c = z > 0.7 ? 3 : (z > 0.4 ? 2 : 1);
    for(let i=0;i<cols;i++){
      const t = i/cols;
      const hi = Math.floor((t*N + Math.sin(phase+r*0.6)*2 + N)) % N;
      const hh = Math.floor(data[hi]*12);
      const x0 = x + Math.floor(t*w);
      const x1 = x + Math.floor((i+1)/cols*w);
      hline(x0, yy-hh, Math.max(1,x1-x0), c);
      for(let d=0;d<hh;d++) px(x0, yy-d, c);
    }
  }
  const sg = getSpectrum(8);
  drawText('TERRAIN', x+2, y+2, 1, 0);
  for(let i=0;i<8;i++){
    const bh = Math.floor(sg[i]*h*0.2);
    for(let j=0;j<bh;j++) px(x+w-10-i*3, y+h-2-j, 2);
  }
}

/* 機能8: 回転ワイヤーフレームトーラス */
function vizTorus(x,y,w,h,f){
  const cx = x+w/2, cy = y+h/2;
  const sx = w*0.28, sy = h*0.42;
  const R = 1.0, r = 0.42;
  const data = getSpectrum(24);
  const t = f*0.035;
  const N1 = 14, N2 = 8;
  for(let i=0;i<N1;i++){
    const u = i/N1 * Math.PI*2;
    const rad = R + r*Math.cos(0) + data[i%24]*0.4;
    const pts = [];
    for(let j=0;j<=N2;j++){
      const v = j/N2 * Math.PI*2;
      const rr = R + r*Math.cos(v);
      const p3 = [Math.cos(u)*rr, r*Math.sin(v), Math.sin(u)*rr];
      pts.push(proj3(rot3(p3, 0.7, t), cx, cy, sx, sy, 2.8));
    }
    for(let j=0;j<N2;j++) line3(pts[j], pts[j+1], 2);
  }
  for(let j=0;j<N2;j++){
    const v = j/N2 * Math.PI*2;
    const pts = [];
    for(let i=0;i<=N1;i++){
      const u = i/N1 * Math.PI*2;
      const rr = R + r*Math.cos(v);
      const p3 = [Math.cos(u)*rr, r*Math.sin(v), Math.sin(u)*rr];
      pts.push(proj3(rot3(p3, 0.7, t), cx, cy, sx, sy, 2.8));
    }
    for(let i=0;i<N1;i++) line3(pts[i], pts[i+1], i%3?1:3);
  }
  drawText('TORUS', x+2, y+2, 1, 0);
}

const DIAG_ITEMS = [
  ['CPU','SH-4A CORE'], ['SDRAM','64MB CHECK'], ['FLASH','32MB CHECK'],
  ['DSP','SOUND ENGINE'], ['OEL','DISPLAY PANEL'], ['TUNER','FM/AM FRONTEND'],

function diagStart(){ state.diagStep = 0; }
function drawDiag(){
  clearFB(0);
  fillRect(0,0,W,STATUS_H,2);
  drawText('SELF DIAGNOSTIC', 4, 4, 3, 0);
  drawTextRight(L('[ESC]EXIT','[ESC]終了'), W-4, 4, 2, 0);
  const y0 = STATUS_H + 3;
  for(let i=0;i<DIAG_ITEMS.length;i++){
    const y = y0 + i*11;
    drawText(DIAG_ITEMS[i][0], 6, y, 2, 0);
    drawText(DIAG_ITEMS[i][1], 46, y, 1, 0);
    if(i < state.diagStep) drawTextRight('OK', W-4, y, 5, 0);
    else if(i === state.diagStep && (state.frame>>2 & 1)===0)
      drawTextRight('....', W-4, y, 6, 0);
  }
  if(state.diagStep >= DIAG_ITEMS.length)
    drawTextCenter('ALL PASS', W/2, H-11, 5, 0);
}

/* --- スピーカーテスト --- */
const SPK_CH = [
  { name:'FRONT L',      freq:1000, pan:-1.0, jp:'前左' },
  { name:'FRONT R',      freq:1000, pan: 1.0, jp:'前右' },
  { name:'REAR L',       freq:1000, pan:-1.0, jp:'後左' },
  { name:'REAR R',       freq:1000, pan: 1.0, jp:'後右' },
  { name:'SUB WOOFER',   freq: 60,  pan: 0.0, jp:'サブウーファ' },
  { name:'LEFT (FL+RL)', freq:1000, pan:-1.0, jp:'左ch' },
  { name:'RIGHT(FR+RR)', freq:1000, pan: 1.0, jp:'右ch' },
  { name:'ALL',          freq:1000, pan: 0.0, jp:'全ch' },
];
function drawSpkTest(){
  clearFB(0);
  fillRect(0,0,W,STATUS_H,2);
  drawText('SPEAKER TEST', 4, 4, 3, 0);
  drawTextRight(L('[ESC]EXIT','[ESC]終了'), W-4, 4, 2, 0);

  const ch = SPK_CH[state.spkTestIdx];
  const cx = W/2, cy = 50;
  // 車体
  rectOutline(cx-80, cy-16, 160, 32, 1);
  // 4スピーカー位置
  const spkPos = [
    [cx-70, cy-12], [cx+70, cy-12], [cx-70, cy+12], [cx+70, cy+12]
  ];
  const activeIdx = (state.spkTestIdx < 4) ? state.spkTestIdx
                  : (state.spkTestIdx === 5 ? 2 : state.spkTestIdx === 6 ? 3 : -1);
  const activeFL = state.spkTestIdx===0 || state.spkTestIdx===5 || state.spkTestIdx===7;
  const activeFR = state.spkTestIdx===1 || state.spkTestIdx===6 || state.spkTestIdx===7;
  const activeRL = state.spkTestIdx===2 || state.spkTestIdx===5 || state.spkTestIdx===7;
  const activeRR = state.spkTestIdx===3 || state.spkTestIdx===6 || state.spkTestIdx===7;
  const act = [activeFL, activeFR, activeRL, activeRR];
  const pulse = (Math.floor(state.frame/3)%2)===0;

  for(let i=0;i<4;i++){
    const [x,y] = spkPos[i];
    const c = act[i] ? (pulse ? 5 : 6) : 2;
    for(let a=0;a<Math.PI*2;a+=0.4)
      px(x+Math.cos(a)*5, y+Math.sin(a)*5, c);
    px(x, y, act[i]?3:1);
  }
  // サブ
  if(state.spkTestIdx===4){
    for(let a=0;a<Math.PI*2;a+=0.4)
      px(cx+Math.cos(a)*8, cy+Math.sin(a)*8, pulse?4:6);
  }
  // ラベル
  const lbl = state.lang===1 ? ch.jp : ch.name;
  drawTextCenter(lbl, cx, 78, act.some(Boolean)||state.spkTestIdx===4 ? 3 : 2, 1);
  drawTextCenter(String(state.spkTestIdx+1) + ' / ' + SPK_CH.length, cx, 92, 2);
  drawTextCenter(L('[LR]SELECT [ENT]NEXT [ESC]EXIT',
                   '[←→]選択 [決定]次へ [ESC]終了'), cx, 104, 1);
}

/* ==========================================================================
   TEST TONE ENGINE (speaker test / signal gen)
   ========================================================================== */
let testOsc = null, testPan = null, testGain = null, testNoise = null, testNoiseFilt = null;
let testMode = 'off';

function testToneStop(){
  try{ if(testOsc){ testOsc.stop(); testOsc.disconnect(); } }catch(e){}
  try{ if(testPan) testPan.disconnect(); }catch(e){}
  try{ if(testGain) testGain.disconnect(); }catch(e){}
  try{ if(testNoise){ testNoise.stop(); testNoise.disconnect(); } }catch(e){}
  try{ if(testNoiseFilt) testNoiseFilt.disconnect(); }catch(e){}
  testOsc = testPan = testGain = testNoise = testNoiseFilt = null;
  testMode = 'off';
}
function testToneStart(kind, freq, pan, vol){
  if(!actx) return;
  testToneStop();
  testGain = actx.createGain();
  testGain.gain.value = 0;
  testPan = actx.createStereoPanner();
  testPan.pan.value = pan;
  testGain.connect(testPan);
  testPan.connect(actx.destination);

  if(kind === 'white' || kind === 'pink'){
    const len = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const dd = buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<len;i++){
      const w = Math.random()*2-1;
      if(kind === 'pink'){
        b0 = 0.99886*b0 + w*0.0555179;
        b1 = 0.99332*b1 + w*0.0750759;
        b2 = 0.96900*b2 + w*0.1538520;
        b3 = 0.86650*b3 + w*0.3104856;
        b4 = 0.55000*b4 + w*0.5329522;
        b5 = -0.7616*b5 - w*0.0168980;
        dd[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
        b6 = w*0.115926;
      } else {
        dd[i] = w;
      }
    }
    testNoise = actx.createBufferSource();
    testNoise.buffer = buf;
    testNoise.loop = true;
    testNoise.connect(testGain);
    testNoise.start();
  } else if(kind === 'sweep'){
    testOsc = actx.createOscillator();
    testOsc.type = 'sine';
    testOsc.frequency.setValueAtTime(20, actx.currentTime);
    testOsc.frequency.exponentialRampToValueAtTime(20000, actx.currentTime + 6);
    testOsc.connect(testGain);
    testOsc.start();
  } else if(kind === 'silent'){
    // nothing
  } else {
    testOsc = actx.createOscillator();
    testOsc.type = kind || 'sine';
    testOsc.frequency.value = freq || 1000;
    testOsc.connect(testGain);
    testOsc.start();
  }
  testGain.gain.setTargetAtTime(vol || 0.15, actx.currentTime, 0.05);
  testMode = kind;
}

const svcEng = {
  active: null,
  nodes: [],
  osc: null, osc2: null, noise: null,
  gain: null, pan: null, filter: null, filter2: null,
  delay: null, fb: null, shaper: null, conv: null,
  comp: null, mod: null, modGain: null,
  split: null, merge: null, invL: null, invR: null,
  params: {},
  resumeMusic: false,

  cleanup(){
    for(const n of this.nodes){
      try{ if(n.stop) n.stop(); }catch(e){}
      try{ n.disconnect(); }catch(e){}
    }
    this.nodes = [];
    this.osc = this.osc2 = this.noise = null;
    this.gain = this.pan = this.filter = this.filter2 = null;
    this.delay = this.fb = this.shaper = this.conv = null;
    this.comp = this.mod = this.modGain = null;
    this.split = this.merge = this.invL = this.invR = null;
    this.active = null;
    this.params = {};
    if(this.impInterval){ clearInterval(this.impInterval); this.impInterval = null; }
  },
  add(n){ if(n){ this.nodes.push(n); } return n; },

  _ensureCtx(){
    if(!actx){ initAudio(); }
    if(actx && actx.state === 'suspended') actx.resume();
    return actx;
  },

  makeOsc(freq, type){
    const o = actx.createOscillator();
    o.type = type || 'sine';
    o.frequency.value = freq;
    this.add(o);
    return o;
  },
  makeNoise(kind){
    const len = actx.sampleRate * 2;
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    if(kind === 'pink'){
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<len;i++){
        const w = Math.random()*2-1;
        b0 = 0.99886*b0 + w*0.0555179;
        b1 = 0.99332*b1 + w*0.0750759;
        b2 = 0.96900*b2 + w*0.1538520;
        b3 = 0.86650*b3 + w*0.3104856;
        b4 = 0.55000*b4 + w*0.5329522;
        b5 = -0.7616*b5 - w*0.0168980;
        d[i] = (b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
        b6 = w*0.115926;
      }
    } else {
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    }
    const src = actx.createBufferSource();
    src.buffer = buf; src.loop = true;
    this.add(src);
    return src;
  },
  makeGain(v){ const g = actx.createGain(); g.gain.value = v; this.add(g); return g; },
  makePan(p){ const n = actx.createStereoPanner(); n.pan.value = p||0; this.add(n); return n; },

  stop(){
    if(this.resumeMusic && audioEl.src && state.discIn && playlist.length){
      audioEl.play().catch(()=>{});
    }
    this.resumeMusic = false;
    this.cleanup();
  },

  begin(){
    if(isPlaying && !audioEl.paused){
      this.resumeMusic = true;
      audioEl.pause();
    }
    this.cleanup();
    this._ensureCtx();
  },
};

  /* -------- 4. PINK NOISE + RTA -------- */
  rta: {
    name:'PINK + RTA', jp:'ピンクノイズ+分析',
    hint:'[UD]音量 [ENT]ノイズ種 [ESC]戻る',
    start(){

      ana.smoothingTimeConstant = 0.7;

      n.connect(g); g.connect(ana); ana.connect(actx.destination);

    },
    draw(f){
      clearFB(0);
      drawSvcHeader('PINK + RTA', this.jp);
      const ana = svcEng.analyser;
      if(!ana) return;
      ana.getByteFrequencyData(svcEng.rtaData);
      const nyq = actx.sampleRate / 2;
      const centers = [];
      for(let i=0;i<31;i++) centers.push(25 * Math.pow(2, i/3));
      const barW = Math.floor((W-16) / 31);
      for(let b=0;b<31;b++){
        const fc = centers[b];
        const lo = fc / Math.pow(2, 1/6);
        const hi = fc * Math.pow(2, 1/6);
        const i0 = Math.max(0, Math.floor(lo / nyq * ana.frequencyBinCount));
        const i1 = Math.min(ana.frequencyBinCount-1, Math.floor(hi / nyq * ana.frequencyBinCount));
        let sum = 0, cnt = 0;
        for(let i=i0;i<=i1;i++){ sum += svcEng.rtaData[i]; cnt++; }
        const v = cnt ? sum/cnt/255 : 0;
        const bh = Math.max(1, Math.floor(v * 60));
        const x = 8 + b*barW;
        for(let j=0;j<bh;j++){
          const c = j > 42 ? 4 : (j > 24 ? 6 : 3);
          px(x, 74-j, c);
          px(x+1, 74-j, c);
          if(barW > 3) px(x+2, 74-j, c);
        }
        if(b % 5 === 0){
          const lbl = fc >= 1000 ? (fc/1000).toFixed(fc%1000?1:0)+'k' : String(Math.round(fc));
          drawTextCenter(lbl, x+barW/2, 78, 1, 0);
        }
      }
      hline(8, 74, W-16, 2);
      drawTextCenter(svcEng.params.noiseKind.toUpperCase() + ' NOISE', W/2, 20, 3, 1);
      drawTextCenter('1/3 OCT  RTA  31 BAND', W/2, 32, 2, 0);
      drawTextCenter(this.hint, W/2, 114, 1, 0);
    },
    onKey(k){
      const p = svcEng.params;
      if(k==='UP'){   p.vol = Math.min(0.4, p.vol+0.03); svcEng.gain.gain.value = p.vol; seUp3(); }
      if(k==='DOWN'){ p.vol = Math.max(0.02, p.vol-0.03); svcEng.gain.gain.value = p.vol; seDn3(); }
      if(k==='ENTER'){
        p.noiseKind = (p.noiseKind === 'pink') ? 'white' : 'pink';
        svcEng.noise.stop(); svcEng.noise.disconnect();
        const n = svcEng.makeNoise(p.noiseKind);
        n.connect(svcEng.gain);
        svcEng.noise = n;
        n.start();
        seNm3();
      }
    }
  },

  /* -------- 5. CROSSOVER -------- */
  crossover: {
    name:'CROSSOVER', jp:'クロスオーバー',
    hint:'[LR]周波数 [UD]HPF/LPF [ENT]ON/OFF [ESC]戻る',
    start(){
      svcEng.begin();
      svcEng.params = { filterType:'lowpass', freq:1000, slope:12, on:true };
      const n = svcEng.makeNoise('pink');
      const f1 = actx.createBiquadFilter();
      f1.type = 'lowpass'; f1.frequency.value = 1000; f1.Q.value = 0.7;
      svcEng.add(f1);
      const g = svcEng.makeGain(0.18);
      svcEng.noise = n; svcEng.filter = f1; svcEng.gain = g;
      n.connect(f1); f1.connect(g); g.connect(actx.destination);
      n.start();
    },
    draw(f){
      clearFB(0);
      drawSvcHeader('CROSSOVER', this.jp);
      const p = svcEng.params;
      const logMin = Math.log10(20), logMax = Math.log10(20000);
      const y0 = 30, yH = 60;
      for(let fr of [100,1000,10000]){
        const t = (Math.log10(fr)-logMin)/(logMax-logMin);
        const x = 10 + t*(W-20);
        vline(x, y0, yH, 1);
        drawTextCenter(fr>=1000?(fr/1000)+'k':String(fr), x, y0+yH+2, 1, 0);
      }
      const fc = p.freq;
      for(let i=0;i<W-20;i++){
        const t = i/(W-20);
        const freq = Math.pow(10, logMin + t*(logMax-logMin));
        let gainDb;
        if(p.filterType === 'lowpass'){
          const oct = Math.log2(freq/fc);
          gainDb = oct > 0 ? -oct * 12 : 0;
        } else {
          const oct = Math.log2(freq/fc);
          gainDb = oct < 0 ? oct * 12 : 0;
        }
        const yy = y0 + yH/2 - Math.max(-50, Math.min(10, gainDb)) / 60 * yH;
        px(10+i, yy, 3);
      }
      const fct = (Math.log10(fc)-logMin)/(logMax-logMin);
      const fcx = 10 + fct*(W-20);
      vline(fcx, y0, yH, 6);
      drawTextCenter((p.filterType==='lowpass'?'LPF':'HPF'), W/2, 18, 3, 1);
      drawTextCenter(Math.round(fc) + ' Hz  /  -' + p.slope + 'dB/oct', W/2, 96, 5, 0);
      drawTextCenter(this.hint, W/2, 114, 1, 0);
    },
    onKey(k){
      const p = svcEng.params;
      if(k==='LEFT'){  p.freq = Math.max(20, p.freq/1.15); svcEng.filter.frequency.value = p.freq; seDn3(); }
      if(k==='RIGHT'){ p.freq = Math.min(20000, p.freq*1.15); svcEng.filter.frequency.value = p.freq; seUp3(); }
      if(k==='UP' || k==='DOWN'){
        p.filterType = p.filterType==='lowpass'?'highpass':'lowpass';
        svcEng.filter.type = p.filterType;
        seNm3();
      }
      if(k==='ENTER'){
        p.on = !p.on;
        svcEng.filter.type = p.on ? p.filterType : 'allpass';
        seNm3();
      }
    }
  },

    hint:'[LR]ドライブ [ESC]戻る',

      svcEng.begin();
      svcEng.params = { drive:30 };

      const curve = new Float32Array(n);
      for(let i=0;i<n;i++){

        curve[i] = Math.tanh(x * k/10);
      }
      svcEng.shaper.curve = curve;

      clearFB(0);
      drawSvcHeader('DISTORTION', this.jp);
      const p = svcEng.params;
      const y0 = 40, amp = 30;
      for(let i=0;i<W-20;i++){
        const t = (i/(W-20)) * Math.PI * 8;
        const raw = Math.sin(t);
        const distorted = Math.tanh(raw * p.drive/10);
        const yy = y0 + 30 - Math.round(distorted * amp);
        px(10+i, yy, 3);
        const yr = y0 + 30 - Math.round(raw * amp * 0.6);

  /* -------- 9. REVERB -------- */
  reverb: {
    name:'REVERB', jp:'リバーブ',
    hint:'[LR]部屋サイズ [ENT]ON/OFF [ESC]戻る',
    start(){
      svcEng.begin();
      svcEng.params = { room:1, on:true };
      const osc = svcEng.makeOsc(300, 'square');
      const conv = actx.createConvolver();
      svcEng.osc = osc; svcEng.conv = conv;
      this._setIR(1);
      const dry = svcEng.makeGain(0.08);
      const wet = svcEng.makeGain(0.3);
      svcEng.dry = dry; svcEng.wet = wet;
      osc.connect(dry); dry.connect(actx.destination);
      osc.connect(conv); conv.connect(wet); wet.connect(actx.destination);
      osc.start();
      const lfo = svcEng.makeOsc(2.5, 'square');
      const lfoG = svcEng.makeGain(0.05);
      lfo.connect(lfoG); lfoG.connect(dry.gain); lfoG.connect(wet.gain);
      lfo.start();
    },
    _setIR(idx){
      const dur = [0.3, 0.8, 2.5][idx];
      const rate = actx.sampleRate;
      const len = Math.floor(dur * rate);
      const buf = actx.createBuffer(2, len, rate);
      for(let ch=0;ch<2;ch++){
        const d = buf.getChannelData(ch);
        for(let i=0;i<len;i++){
          const t = i/len;
          d[i] = (Math.random()*2-1) * Math.pow(1-t, idx+1.5);
        }
      }
      svcEng.conv.buffer = buf;
    },
    draw(f){
      clearFB(0);
      drawSvcHeader('REVERB', this.jp);
      const p = svcEng.params;
      const names = ['SMALL','MEDIUM','HALL'];
      drawTextCenter(names[p.room], W/2, 20, 3, 2);
      const cy = 70;
      const sz = [40, 70, 110][p.room];
      rectOutline(W/2-sz, cy-sz/2, sz*2, sz, 2);
      for(let a=0;a<Math.PI*2;a+=0.3)
        px(W/2+Math.cos(a)*4, cy+Math.sin(a)*4, 5);
      for(let i=0;i<4;i++){
        const r = ((f*2 + i*25) % 100);
        if(r > sz) continue;
        for(let a=0;a<Math.PI*2;a+=0.2){
          px(W/2+Math.cos(a)*r, cy+Math.sin(a)*r*0.5, 3);
        }
      }
      drawTextCenter(p.on ? 'ON' : 'OFF', W/2, 104, p.on?5:4, 0);
      drawTextCenter(this.hint, W/2, 114, 1, 0);
    },
    onKey(k){
      const p = svcEng.params;
      if(k==='LEFT'){  p.room = Math.max(0, p.room-1); this._setIR(p.room); seDn3(); }
      if(k==='RIGHT'){ p.room = Math.min(2, p.room+1); this._setIR(p.room); seUp3(); }
      if(k==='ENTER'){ p.on = !p.on;
        svcEng.wet.gain.value = p.on ? 0.3 : 0;
        svcEng.dry.gain.value = p.on ? 0.08 : 0.15;
        seNm3();
      }
    }
  },

  /* -------- 10. SPEAKER TEST -------- */
  speakers: {
    name:'SPEAKER TEST', jp:'SPテスト',
    hint:'[LR]ch切替 [ENT]再鳴動 [ESC]戻る',
    start(){
      svcEng.begin();
      svcEng.params = { idx:0 };

    },
    _ping(i){
      svcEng.params.idx = i;
      // 発音ノードだけ差し替え（既存は停止）
      for(const n of svcEng.nodes){
        try{ if(n.stop) n.stop(); }catch(e){}
        try{ n.disconnect(); }catch(e){}
      }
      svcEng.nodes = [];
      const ch = [
        { name:'FRONT L',   freq:1000, pan:-0.9 },
        { name:'FRONT R',   freq:1000, pan: 0.9 },
        { name:'REAR L',    freq:1000, pan:-0.9 },
        { name:'REAR R',    freq:1000, pan: 0.9 },
        { name:'SUB WOOFER',freq:60,  pan: 0.0 },
      ][i];
      const o = svcEng.makeOsc(ch.freq, ch.freq<100?'sine':'square');
      const p = svcEng.makePan(ch.pan);
      const g = svcEng.makeGain(0);
      o.connect(p); p.connect(g); g.connect(actx.destination);
      o.start();
      const t = actx.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.18, t+0.02);
      g.gain.setValueAtTime(0.18, t+0.6);
      g.gain.linearRampToValueAtTime(0, t+0.75);
    },
    draw(f){
      clearFB(0);
      drawSvcHeader('SPEAKER TEST', this.jp);
      const idx = svcEng.params.idx;
      const cx = W/2, cy = 55;
      rectOutline(cx-80, cy-22, 160, 44, 1);
      hline(cx-80, cy+8, 160, 1);
      const pos = [[cx-70, cy-14],[cx+70, cy-14],[cx-70, cy+14],[cx+70, cy+14]];
      const pulse = (Math.floor(f/3)%2)===0;
      for(let i=0;i<4;i++){
        const [x,y] = pos[i];
        const on = (idx === i);
        const c = on ? (pulse?5:6) : 2;
        for(let a=0;a<Math.PI*2;a+=0.4)
          px(x+Math.cos(a)*5, y+Math.sin(a)*5, c);
        px(x, y, on?3:1);
      }
      if(idx === 4){
        for(let a=0;a<Math.PI*2;a+=0.4)
          px(cx+Math.cos(a)*10, cy+Math.sin(a)*10, pulse?4:6);
      }
      const names = ['FRONT L','FRONT R','REAR L','REAR R','SUB WOOFER'];
      drawTextCenter(names[idx], W/2, 88, 3, 1);
      drawTextCenter((idx+1) + ' / 5', W/2, 100, 2);
      drawTextCenter(this.hint, W/2, 114, 1, 0);
    },
    onKey(k){
      const idx = svcEng.params.idx;
      if(k==='LEFT'){  this._ping((idx+4)%5); seDn3(); }
      if(k==='RIGHT'){ this._ping((idx+1)%5); seUp3(); }
      if(k==='ENTER'){ this._ping(idx); seNm3(); }
    }
  },

  /* -------- 11. VOCAL ELIM -------- */
  vocancel: {
    name:'VOCAL ELIM', jp:'ボーカルキャンセル',
    hint:'[ENT]ON/OFF [ESC]戻る',
    start(){
      svcEng.begin();
      svcEng.params = { on:false };
      if(audioEl.src && state.discIn && playlist.length){
        audioEl.play().catch(()=>{});
        svcEng.resumeMusic = false;
      }
      if(mediaSrc && actx){
        const split = actx.createChannelSplitter(2);
        const merge = actx.createChannelMerger(2);
        const gL = actx.createGain(); gL.gain.value = 1;
        const gR = actx.createGain(); gR.gain.value = 1;
        const invR = actx.createGain(); invR.gain.value = 0;
        svcEng.add(split); svcEng.add(merge); svcEng.add(gL); svcEng.add(gR); svcEng.add(invR);
        try{ mediaSrc.disconnect(); }catch(e){}
        mediaSrc.connect(split);
        split.connect(gL, 0);
        split.connect(gR, 1);
        gL.connect(merge, 0, 0);
        gR.connect(invR); invR.connect(merge, 0, 0);
        gR.connect(merge, 0, 1);
        merge.connect(masterGain);
        svcEng.vocalInvR = invR;
        svcEng.vocalMerge = merge;
      }
    },
    stop(){
      try{
        if(mediaSrc){
          mediaSrc.disconnect();

        else if(fr < p.freq*2) db = p.gain * (1 - (fr - p.freq)/p.freq);

      if(k==='DOWN'){ p.gain = Math.max(-12, p.gain-2); svcEng.filter.gain.value = p.on ? p.gain : 0; seDn3(); }

const engineScreens = new Map();   // id -> { draw(f), onKey(k) }

function enginePickFile(){
  const inp = document.createElement('input');

function createEngineAPI(){
  let pluginId = 'plugin_' + Date.now().toString(36);
  return {
    version: '3.50',
    id: pluginId,
    W, H, PW, PH,
    // ---- 直接 state アクセス（意図的に公開） ----
    state,
    // ---- メニュー ----
    menu: {
      // サービストップに項目を追加
      add(item){
        const target = MENUS.service;
        target.items.push({
          t: 'act',
          label: item.label || 'PLUGIN',
          labelJp: item.labelJp || item.label || 'プラグイン',
          act: ()=>{ if(item.onActivate) item.onActivate(); }
        });
      }
    },
    // ---- 画面 ----
    screen: {
      // カスタム画面を表示 { draw(f), onKey(k) }
      show(id, defs){
        engineScreens.set(id, defs || {});
        state.customScreen = { id };
        state.screen = 'custom';
      },
      close(){
        state.customScreen = null;
        state.screen = 'menu';
      }
    },
    // ---- 描画 ----
    draw: {
      clear(v){ clearFB(v|0); },
      pixel(x,y,c){ px(x,y,c); },
      rect(x,y,w,h,c){ fillRect(x,y,w,h,c); },
      outline(x,y,w,h,c){ rectOutline(x,y,w,h,c); },
      line(x0,y0,x1,y1,c){ line3([x0,y0],[x1,y1],c); },
      text(x,y,s,c,sp){ drawText(String(s), x, y, c|0, sp); },
      textCenter(x,y,s,c,sp){ drawTextCenter(String(s), x, y, c|0, sp); },
      textRight(x,y,s,c,sp){ drawTextRight(String(s), x, y, c|0, sp); },
      textBig(x,y,s,c,sc,sp){ drawTextBig(String(s), x, y, c|0, sc, sp); },
      hline(x,y,w,c){ hline(x,y,w,c); },
      vline(x,y,h,c){ vline(x,y,h,c); },
      setClip(x,y,w,h){ setClip(x,y,w,h); },
      resetClip(){ resetClip(); },
      palette(i){ return (THEMES[state.theme].pal[i|0] || [0,0,0]).slice(); },
    },
    // ---- オーディオ ----
    audio: {
      ctx(){ return actx; },
      spectrum(n){ return Array.from(getSpectrum(n|0)); },
      wave(n){ return Array.from(getWave(n|0)); },
      // 単発トーン
      tone(freq, dur, type, vol){
        if(!actx) return;
        try{
          const t = actx.currentTime;
          const o = actx.createOscillator(), g = actx.createGain();
          o.type = type || 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol || 0.15, t+0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
          o.connect(g); g.connect(actx.destination);
          o.start(t); o.stop(t+dur+0.02);
        }catch(e){}
      },
      // 定位付きトーン
      panTone(freq, dur, pan, vol){
        if(!actx) return;
        try{
          const t = actx.currentTime;
          const o = actx.createOscillator();
          const p = actx.createStereoPanner();
          const g = actx.createGain();
          o.type = 'sine'; o.frequency.value = freq;
          p.pan.value = pan;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol || 0.15, t+0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
          o.connect(p); p.connect(g); g.connect(actx.destination);
          o.start(t); o.stop(t+dur+0.02);
        }catch(e){}
      }
    },
    // ---- 効果音 ----
    se: {
      up: ()=>seUp3(),
      dn: ()=>seDn3(),
      ok: ()=>seNm3(),
      boot: ()=>seBt5(),
      shutdown: ()=>seSd5(),
    },
    // ---- 入力 ----
    input: {
      onKey(fn){ engineScreens.get(pluginId) || 0; state._engineKeyHandlers = state._engineKeyHandlers || []; state._engineKeyHandlers.push(fn); return fn; },
      off(fn){ if(state._engineKeyHandlers){ const i = state._engineKeyHandlers.indexOf(fn); if(i>=0) state._engineKeyHandlers.splice(i,1); } }
    },
    // ---- ストレージ（名前空間付き） ----
    store: {
      get(k){ try{ return JSON.parse(localStorage.getItem('PAA_ENG_' + k) || 'null'); }catch(e){ return null; } },
      set(k,v){ try{ localStorage.setItem('PAA_ENG_' + k, JSON.stringify(v)); }catch(e){} },
      del(k){ try{ localStorage.removeItem('PAA_ENG_' + k); }catch(e){} }
    },
    // ---- ユーティリティ ----
    L, T, clamp, lerp, pad2, fmtTime, timeStr,
    log(){ try{ console.log.apply(console, ['[PAA-ENG]'].concat(Array.from(arguments))); }catch(e){} },
  };
}

function engineLoadFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const src = String(reader.result);
      const api = createEngineAPI();
      const fn = new Function('PAA', 'console', '"use strict";\n' + src);
      fn(api, { log: api.log, warn: api.log, error: api.log });
      // プラグイン名をスクリプトから抽出できなければファイル名を使う
      const name = (src.match(/@name\s+([^\n*]+)/) || [, file.name.replace(/\.js$/,'')])[1].trim();
      const version = (src.match(/@version\s+([^\n*]+)/) || [,'1.0'])[1].trim();
      state.enginePlugins.push({
        id: api.id,
        name: name.slice(0,28),
        version: version.slice(0,10),
        items: [],
      });
      seBt5();
      svcStub('ENGINE', 'LOADED: ' + name);
    }catch(e){
      errLog.unshift({ t:new Date(), msg:'ENGINE: ' + String(e.message||e).slice(0,36) });
      svcStub('ENGINE', 'LOAD ERROR');
      seSd5();
    }
  };
  reader.readAsText(file);
}

/* ==========================================================================
   9. HELPERS
   ========================================================================== */
function timeStr(){
  let h = state.clockH, m = state.clockM;
  if(state.clock24 === 1){
    const isPM = h >= 12;
    let hh = h % 12; if(hh===0) hh = 12;
    if(state.lang === 1){
      return (isPM?'午後 ':'午前 ') + pad2(hh)+':'+pad2(m);
    }
    return pad2(hh)+':'+pad2(m)+' '+(isPM?'PM':'AM');
  }
  return pad2(h)+':'+pad2(m);
}
function timeStrShort(){
  let h = state.clockH, m = state.clockM;
  if(state.clock24 === 1){
    let hh = h % 12; if(hh===0) hh = 12;
    return pad2(hh)+':'+pad2(m);
  }
  return pad2(h)+':'+pad2(m);
}
function pad2(n){ n = Math.floor(n); return (n<10?'0':'')+n; }
function fmtTime(sec){
  if(!isFinite(sec)||sec<0) sec = 0;
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return pad2(m)+':'+pad2(s);
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function easeOut(p){ return 1-Math.pow(1-p,3); }
function hash1(i){
  i=(i^61)^(i>>>16); i=i+(i<<3); i=i^(i>>>4);
  i=Math.imul(i,0x27d4eb2d); i=i^(i>>>15);
  return (i>>>0)/4294967296;
}
function L(en, jp){ return state.lang === 1 ? jp : en; }

const SRC_RING_LIST = ['CD','MD','FM','AM','AUX'];
const SRC_RING_ICON = { CD:'disc', MD:'md', FM:'wave', AM:'tower', AUX:'plug' };

/* ソースアイコン */
function drawSrcIcon(kind, cx, cy, r, c){
  cx = Math.round(cx); cy = Math.round(cy); r = Math.max(2, Math.round(r));
  switch(kind){
    case 'disc':   // CD
      for(let a=0;a<Math.PI*2;a+=0.18) px(cx+Math.cos(a)*r, cy+Math.sin(a)*r, c);
      for(let a=0;a<Math.PI*2;a+=0.22)
        px(cx+Math.cos(a)*Math.max(1,Math.floor(r/2)),
           cy+Math.sin(a)*Math.max(1,Math.floor(r/2)), c);
      px(cx, cy, c);
      break;
    case 'md':     // MD
      rectOutline(cx-r, cy-r+1, r*2+1, r*2-1, c);
      for(let a=0;a<Math.PI*2;a+=0.30)
        px(cx+Math.cos(a)*Math.max(1, r-2),
           cy+Math.sin(a)*Math.max(1, r-2), c);
      break;
    case 'wave':   // FM
      px(cx-2, cy, c);
      for(let a=-1.0;a<=1.0;a+=0.14)
        px(cx-2+Math.cos(a)*Math.max(2,r-1),
           cy+Math.sin(a)*Math.max(2,r-1), c);
      for(let a=-0.9;a<=0.9;a+=0.14)
        px(cx-2+Math.cos(a)*Math.max(3,r+1),
           cy+Math.sin(a)*Math.max(3,r+1), c);
      break;
    case 'tower':  // AM
      vline(cx, cy-r, r*2+1, c);
      hline(cx-r, cy-r, r*2+1, c);
      hline(cx-r, cy+r, r*2+1, c);
      hline(cx-r, cy, r*2+1, c);
      break;
    case 'plug':   // AUX
      for(let a=0;a<Math.PI*2;a+=0.30)
        px(cx+Math.cos(a)*Math.max(2, r-1),
           cy+Math.sin(a)*Math.max(2, r-1), c);
      px(cx-1, cy-1, c); px(cx, cy-1, c); px(cx+1, cy-1, c);
      px(cx, cy+1, c);
      break;
  }
}

  { baseY: 84,  amp: 2.0, freq: 0.026, spd: -0.030, fill: 0, line: 1 },
  { baseY: 96,  amp: 2.6, freq: 0.032, spd:  0.040, fill: 1, line: 2 },
  { baseY: 108, amp: 3.2, freq: 0.038, spd: -0.050, fill: 1, line: 3 },
];
function srcWaveAt(x, L, f){
  const t = x * L.freq;
  return (
      Math.sin(t*1.00 + f*L.spd)             * L.amp
    + Math.sin(t*2.31 - f*L.spd*1.2 + 0.7)   * L.amp * 0.32
    + Math.sin(t*4.87 + f*L.spd*0.6 + 1.3)   * L.amp * 0.14
  );
}
function drawSrcWave(){
  const f = state.frame;
  for(let li = 0; li < SRC_WAVE_LAYERS.length; li++){
    const L = SRC_WAVE_LAYERS[li];
    if(L.fill > 0){
      for(let x = 0; x < W; x++){
        const y = Math.round(L.baseY + srcWaveAt(x, L, f));
        for(let yy = y + 1; yy < H; yy++) px(x, yy, L.fill);
      }
    }
    for(let x = 0; x < W; x++){
      const y = Math.round(L.baseY + srcWaveAt(x, L, f));
      pset(x, y, L.line);
    }
  }
}

/* リング本体 */
function drawSourceRing(){
  clearFB(0);
  drawSrcWave();

  const cx = W/2;
  const cy = 48;
  const Rx = 155;
  const dA = 0.55;
  const o  = state.selOffset;
  const n  = SRC_RING_LIST.length;

  /* リング状の相対位置を計算 */
  const items = [];
  for(let idx = 0; idx < n; idx++){
    let rel = idx - o;
    while(rel >  n/2) rel -= n;
    while(rel < -n/2) rel += n;
    items.push({
      idx, rel,
      name: SRC_RING_LIST[idx],
      icon: SRC_RING_ICON[SRC_RING_LIST[idx]]
    });
  }
  items.sort((a,b) => Math.abs(b.rel) - Math.abs(a.rel));

  /* リングガイド（薄い楕円） */
  for(let a=0; a<Math.PI*2; a+=0.06){
    const x = cx + Rx * Math.sin(a);
    const y = cy + Math.sin(a*0.5) * 5;
    if(y > H - 26) continue;
    if(y < 6) continue;
    px(x, y, 1);
  }

  /* 各ソースをリング上に配置 */
  for(const it of items){
    const th = -it.rel * dA;
    const sz = Math.cos(th);
    if(sz < -0.25) continue;
    const sx = cx + Rx * Math.sin(th) * (0.55 + 0.45*Math.max(0,sz));
    const sy = cy - 6 * sz;
    const sc = 0.30 + 0.70 * Math.max(0, sz);
    const br = sz > 0.55 ? 5 : (sz > 0.10 ? 3 : (sz > -0.15 ? 2 : 1));
    const r  = Math.max(3, Math.round(10 * sc));

    /* アイコン（テキストの上） */
    drawSrcIcon(it.icon, sx, sy - 18*sc, r, br);

    /* ラベル（中央寄りだけ表示） */
    if(sz > 0.05){
      const fs  = Math.max(1, Math.round(sc * 2));
      const tw_ = tw(it.name, 1) * fs;
      drawTextBig(it.name, Math.round(sx - tw_/2), Math.round(sy + 5), br, fs, 1);
    }
  }
}
/* 画面遷移：そのまま切り替える（残像は glowBuf の自然減衰が担当） */
let fadeSnap = null;
let fadeT = 0;
function fadeTransition(fn){
  fadeSnap = new Uint8Array(fb);   // 現在の画面をスナップショット
  fadeT = 0.30;
  fn();                            // 先に新画面へ切替（内部状態のみ）
}
function drawFadeOverlay(){
  if(fadeT <= 0 || !fadeSnap) return;
  const p = 1 - fadeT/0.30;
  const fadeK = 1 - p;             // 1 → 0
  const N = fb.length;
  for(let i=0;i<N;i++){
    const oldV = (fadeSnap[i] * fadeK) | 0;
    if(oldV > fb[i]) fb[i] = oldV; // 旧画面を薄く重ねる
  }
  if(p >= 1) fadeSnap = null;
}

function beep(freq, dur){
  if(!state.beep || !actx) return;
  try{
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = 'square';
    o.frequency.value = freq || 1600;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.05));
    o.start(t); o.stop(t+(dur||0.05)+0.02);
  }catch(e){}
}

/* ============================================================
   SE (Sound Effects) — 5種
   ============================================================ */
function seTone(freq, start, dur, type, vol){
  if(!state.beep || !actx) return;
  try{
    const t = actx.currentTime + start;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}

function drawStatusBar(){
  // gradient background
  for(let y=0;y<STATUS_H;y++){
    for(let x=0;x<W;x++){
      const v = y < 2 ? 1 : (y < STATUS_H-1 ? 1 : 2);
      pset(x, y, v);
    }
  }
  const src = state.source;
  let srcColor = 3;
  if(src === 'FM') srcColor = 6;
  else if(src === 'AM') srcColor = 6;
  else if(src === 'AUX') srcColor = 5;
  // ===== 再生状態ラベル（CD/MD時） =====
  let xp = 4;
  if(src === 'CD' || src === 'MD'){
    const hasDisc = state.discIn && playlist.length > 0;
    const isPlay  = isPlaying && !audioEl.paused;
    let statusTxt, statusColor;
    if(!hasDisc){
      statusTxt   = L('NO DISC', 'ディスクなし');
      statusColor = 3;             // ← 1 から 3 に変更（背景より明るく）
    } else if(isPlay){
      statusTxt   = L('PLAYING', '再生中');
      statusColor = 5;             // 緑
    } else {
      statusTxt   = L('PAUSE', '一時停止');
      statusColor = 4;             // 赤
    }
    drawText(statusTxt, xp, 4, statusColor);
    xp += tw(statusTxt, 0) + 6;    // 幅に応じて動的にずらす
  }
  // ===== ここまで =====

  // source badge
  drawText(src, xp, 4, srcColor);
  const sepX = xp + tw(src) + 6;
  vline(sepX, 3, 10, 2);

  let midTxt = '';
  let midColor = 2;
  if(src==='CD' || src==='MD'){
    if(!state.discIn){
      midTxt = '';                  // 左のラベルで表示済みのため空に
    } else if(!playlist.length){
      midTxt = L('TRACK --','トラック --');
    } else if(state.playQueue && state.playQueue.length){
      // キュー再生中: ▶ グループ名 3/8
      const qpos = state.playQueue.indexOf(state.cdTrack);
      const cur  = qpos >= 0 ? qpos+1 : 1;
      const prefix = '>' + pad2(cur) + '/' + pad2(state.playQueue.length) + ' ';
      let glabel = state.playQueueLabel || L('GROUP','グループ');
      // 使える幅からラベルを省略
      const avail = 200;
      glabel = ellipsize(glabel, Math.max(20, avail - tw(prefix, 0)), 0);
      midTxt = prefix + glabel;
      midColor = 5;          // キュー中は明色でハイライト
    } else {
      midTxt = L('TRACK ','トラック ') + pad2(state.cdTrack+1) + '/' + pad2(playlist.length);
    }
  } else if(src==='FM'){
    midTxt = state.fmFreq.toFixed(1) + ' MHz';
  } else if(src==='AM'){
    midTxt = state.amFreq + ' kHz';
  } else {
    midTxt = L('AUX IN','外部入力');
  }
  drawText(midTxt, sepX+6, 4, midColor);

  // play mode badge (small)
  if(src==='CD' || src==='MD'){
    const m = PLAY_MODES[state.playMode % PLAY_MODES.length];
    let badge = '--';
    if(m.rep===1) badge = '1';
    else if(m.rep===2) badge = 'ALL';
    else if(m.rnd) badge = 'RND';
    if(m.rnd && m.rep===2) badge = 'A+R';
    if(badge !== '--'){
      drawText('[' + badge + ']', sepX+6+tw(midTxt)+8, 4, 6, 0);
    }
  }

  // time
  const t = timeStr();
  drawText(t, W-4-tw(t), 4, 2);

  // volume bar
  const vw = 44;
  const vx = W - 4 - tw(t) - 10 - vw;
  for(let i=0;i<vw;i++){
    const on = (i/vw) < (state.volume/40);
    const c = on ? (i > vw*0.85 ? 4 : (i > vw*0.65 ? 6 : 3)) : 1;
    px(vx+i, 4, c);
    px(vx+i, 5, c);
    px(vx+i, 6, c);
  }
  rectOutline(vx-1, 3, vw+2, 5, 1);
}

    setClip(tx, y, tw_, h);
    // title (bigger)
    const ty = compact ? y+4 : y+16;
    drawTextBig(track.title.slice(0, Math.floor(tw_/8)), tx, ty, 3, 1, 1);
    // artist
    drawText(track.artist.slice(0, Math.floor(tw_/6)), tx, ty+12, 2, 0);
    // album
    drawText(track.album.slice(0, Math.floor(tw_/6)), tx, ty+22, 1, 0);
    resetClip();
  }

  // progress bar at bottom (only when full)
  if(!compact && track){
    const cur = audioEl.currentTime||0, dur = audioEl.duration||0;
    const pw = w - 16;
    const px0 = x+8, py0 = y+h-10;
    drawText(fmtTime(cur), px0, py0-10, 2, 0);
    drawTextRight(fmtTime(dur), px0+pw, py0-10, 2, 0);
    rectOutline(px0-1, py0-1, pw+2, 6, 1);
    for(let i=0;i<pw;i++){
      const on = dur>0 && (i/pw) < (cur/dur);
      if(on){
        const c = (i/pw) > 0.9 ? 4 : 3;
        px(px0+i, py0, c);
        px(px0+i, py0+1, c);
        px(px0+i, py0+2, c);
        px(px0+i, py0+3, c);
      }
    }
    // playhead
    if(dur>0){
      const phx = px0 + Math.floor((cur/dur)*pw);
      vline(phx, py0-2, 8, 3);
    }
  }
}

function nearestStation(){
  const band = state.tunerBand;
  const list = band===0 ? FM_STATIONS : AM_STATIONS;
  const freq = band===0 ? state.fmFreq : state.amFreq;
  let best = null, bd = 1e9;
  list.forEach(s=>{
    const d = Math.abs(s.f - freq);
    if(d < bd){ bd = d; best = s; }
  });
  return bd <= (band===0?0.4:9.5) ? best : null;
}
function signalStrength(){
  const band = state.tunerBand;
  const list = band===0 ? FM_STATIONS : AM_STATIONS;
  const freq = band===0 ? state.fmFreq : state.amFreq;
  let best = 1e9;
  list.forEach(s=>{ best = Math.min(best, Math.abs(s.f - freq)); });
  const tol = band===0 ? 1.2 : 30;
  return clamp(1 - best/tol, 0, 1);
}

  const midY = Math.floor((barTop+barBot)/2);

  for(let k=-3;k<=3;k++){
    const yy = midY + Math.floor(k*halfH/3);
    for(let i=0;i<13*bw-8;i+=4) px(x0+i, yy, 1);
  }

  drawText('+12', 0, barTop-4, 1, 0);

  drawText('-6', 0, midY + halfH/2 - 4, 1, 0);

      const blink = (Math.floor(state.frame/8)%2)===0;
      fillRect(bx-3, barTop-4, bw-2, barBot-barTop+10, blink?1:0);
      rectOutline(bx-3, barTop-4, bw-2, barBot-barTop+10, 3);

    const pxH = Math.round(Math.abs(v)/12 * halfH);
    const barW = bw - 10;
    const glow = sel ? (0.5 + 0.5*Math.sin(state.frame*0.35)) : 0;

        const yy = midY - 1 - j;

        let c = j > halfH*0.75 ? 4 : 5;
        if(sel && j > pxH-4) c = 7;
        for(let k=0;k<barW;k++) px(bx+k, yy, c);

      if(sel && pxH > 0){
        const topY = midY - pxH;
        for(let k=0;k<barW;k++){
          px(bx+k, topY-1, glow > 0.5 ? 7 : 3);
          px(bx+k, topY-2, 6);
        }
      }
    } else {
      for(let j=0;j<pxH;j++){
        const yy = midY + 1 + j;
        if(yy > barBot) break;
        let c = 4;
        if(sel && j > pxH-4) c = 7;
        for(let k=0;k<barW;k++) px(bx+k, yy, c);
      }
      if(sel && pxH > 0){
        const botY = midY + pxH;
        for(let k=0;k<barW;k++){
          px(bx+k, botY+1, glow > 0.5 ? 7 : 3);
          px(bx+k, botY+2, 6);

      }
    }
    // value marker
    if(sel) {
      const my = v>=0 ? midY-1-pxH : midY+1+pxH;
      hline(bx-2, my, barW+4, 3);
    }
    px(bx+barW/2, midY, 3);
  }

  const fr = EQ_FREQS[state.eqBand];
  const fstr = fr >= 1000 ? (fr/1000).toFixed(fr%1000?2:0)+'k' : String(fr);

/* ============================================================
   OEL TEST PATTERN (RGB 直描画シーケンス)
   ============================================================ */
const TEST_PHASES = [
  { name:'RED',          dur:3.0, kind:'solid', rgb:[255,  0,  0] },
  { name:'GREEN',        dur:3.0, kind:'solid', rgb:[  0,255,  0] },

  { name:'BLACK',        dur:2.0, kind:'solid', rgb:[  0,  0,  0] },
  { name:'GRAYSCALE',    dur:3.0, kind:'gray' },
  { name:'COLOR BARS',   dur:3.0, kind:'bars' },
  { name:'RGB GRADIENT', dur:5.0, kind:'gradientRGB' },
  { name:'HUE SWEEP',    dur:6.0, kind:'hue' },
  { name:'H GRADIENT',   dur:4.0, kind:'gradH' },
  { name:'V GRADIENT',   dur:4.0, kind:'gradV' },
  { name:'NATIVE 480',   dur:5.0, kind:'nativeRamp' },   // 追加
  { name:'PIXEL ZOOM',   dur:6.0, kind:'pixelZoom' },    // 追加
  { name:'STEP WEDGE',   dur:4.0, kind:'stepWedge' },    // 追加
  { name:'CHECKER',      dur:2.5, kind:'checker' },
  { name:'CROSSHATCH',   dur:2.5, kind:'crosshatch' },
  { name:'MOTION',       dur:4.0, kind:'motion' },
