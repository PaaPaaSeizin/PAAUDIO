  { name:'DOT GRID',     dur:3.0, kind:'dots' },
];

let testRGB = null;
function ensureTestRGB(){
  if(!testRGB || testRGB.length !== PW*PH*3) testRGB = new Uint8Array(PW*PH*3);
  return testRGB;
}

/* 1論理ドット = SCALE×SCALE の物理ピクセルを RGB で塗る */
function testPixel(x, y, r, g, b){
  x|=0; y|=0;
  if(x<0||x>=W||y<0||y>=H) return;
  const x0 = Math.floor(x*SCALE), x1 = Math.floor((x+1)*SCALE);
  const y0 = Math.floor(y*SCALE), y1 = Math.floor((y+1)*SCALE);
  for(let yy=y0; yy<y1; yy++){
    const row = yy*PW;
    for(let xx=x0; xx<x1; xx++){
      const i = (row + xx)*3;
      testRGB[i] = r; testRGB[i+1] = g; testRGB[i+2] = b;
    }
  }
}
function testClear(r,g,b){
  ensureTestRGB();
  for(let i=0;i<PW*PH;i++){
    const o = i*3;
    testRGB[o] = r; testRGB[o+1] = g; testRGB[o+2] = b;
  }
}
function testFillRect(x,y,w,h,r,g,b){
  for(let j=0;j<h;j++) for(let i=0;i<w;i++) testPixel(x+i, y+j, r,g,b);
}
/* 5x7 FONT を RGB で描く（テスト画面用・日本語非対応でOK） */
function testText(s, x, y, r, g, b){
  s = String(s).toUpperCase();
  let cx = x;
  for(let n=0;n<s.length;n++){
    const ch = s[n];
    const g7 = FONT[ch] || FONT['?'];
    for(let ry=0; ry<7; ry++){
      const row = g7[ry];
      if(!row) continue;
      for(let bx=0; bx<5; bx++){
        if(row & (1<<(4-bx))) testPixel(cx+bx, y+ry, r,g,b);
      }
    }
    cx += 6;
  }
}
/* HSV→RGB（0-360, 0-1, 0-1）*/
function hsv2rgb(h, s, v){
  h = ((h % 360) + 360) % 360;
  const c = v * s;
  const x = c * (1 - Math.abs(((h/60) % 2) - 1));
  const m = v - c;
  let r,g,b;
  if(h <  60){ r=c; g=x; b=0; }
  else if(h < 120){ r=x; g=c; b=0; }
  else if(h < 180){ r=0; g=c; b=x; }
  else if(h < 240){ r=0; g=x; b=c; }
  else if(h < 300){ r=x; g=0; b=c; }
  else            { r=c; g=0; b=x; }
  return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
}

function drawTest(){
  ensureTestRGB();
  const phase = TEST_PHASES[state.testPhase % TEST_PHASES.length];
  const t = state.testT;
  const f = state.frame;

  switch(phase.kind){
    case 'solid': {
      testClear(phase.rgb[0], phase.rgb[1], phase.rgb[2]);
      const lum = (phase.rgb[0]+phase.rgb[1]+phase.rgb[2])/3;
      const tc = lum > 128 ? [0,0,0] : [255,255,255];
      testText(phase.name, 4, 4, tc[0], tc[1], tc[2]);
      const remain = Math.max(0, Math.ceil(phase.dur - t));
      testText(String(remain), 4, H-14, tc[0], tc[1], tc[2]);
      testFillRect(0,0,3,3, tc[0],tc[1],tc[2]);
      testFillRect(W-3,0,3,3, tc[0],tc[1],tc[2]);
      testFillRect(0,H-3,3,3, tc[0],tc[1],tc[2]);
      testFillRect(W-3,H-3,3,3, tc[0],tc[1],tc[2]);
      return;   // 進行バーは出さない（純色を汚さない）
    }
    case 'gray': {
      const steps = 8, bw = W/steps;
      for(let i=0;i<steps;i++){
        const v = Math.round(255 * i/(steps-1));
        testFillRect(Math.floor(i*bw), 0, Math.ceil(bw), H, v,v,v);
      }
      break;
    }
    case 'bars': {
      const bars = [
        [255,255,255],[255,255,0],[0,255,255],[0,255,0],
        [255,0,255],[255,0,0],[0,0,255],[0,0,0]
      ];
      const bw = W/bars.length;
      for(let i=0;i<bars.length;i++){
        testFillRect(Math.floor(i*bw), 0, Math.ceil(bw), H, bars[i][0], bars[i][1], bars[i][2]);
      }
      break;
    }
    case 'gradientRGB': {
      const shift = f*2;
      for(let x=0;x<W;x++){
        const h = ((x/W)*360 + shift) % 360;
        const [r,g,b] = hsv2rgb(h, 1, 1);
        testFillRect(x, 0, 1, H, r,g,b);
      }
      break;
    }
    case 'hue': {
      const shift = f*3;
      for(let y=0;y<H;y++){
        const val = 1 - (y/H)*0.7;
        for(let x=0;x<W;x++){
          const h = ((x/W)*360 + shift) % 360;
          const [r,g,b] = hsv2rgb(h, 1, val);
          testPixel(x, y, r,g,b);
        }
      }
      break;
    }
    case 'gradH': {
      for(let x=0;x<W;x++){
        const u = x/W;
        let r,g,b;
        if(u < 1/3){ const k=u*3; r=(1-k)*255; g=k*255; b=0; }
        else if(u < 2/3){ const k=(u-1/3)*3; r=0; g=(1-k)*255; b=k*255; }
        else { const k=(u-2/3)*3; r=k*255; g=0; b=(1-k)*255; }
        testFillRect(x, 0, 1, H, r|0,g|0,b|0);
      }
      break;
    }
    case 'gradV': {
      for(let y=0;y<H;y++){
        const u = y/H;
        let r,g,b;
        if(u < 1/3){ const k=u*3; r=(1-k)*255; g=k*255; b=0; }
        else if(u < 2/3){ const k=(u-1/3)*3; r=0; g=(1-k)*255; b=k*255; }
        else { const k=(u-2/3)*3; r=k*255; g=0; b=(1-k)*255; }
        testFillRect(0, y, W, 1, r|0,g|0,b|0);
      }
      break;
    }
    case 'nativeRamp': {
      // 480段のグレースケールを 1論理ピクセルずつ描く。
      // 8論理行ごとに位相を+1して、縦方向の解像度も同時に見えるようにする。
      for(let y=0;y<H;y++){
        const rowBlock = (y >> 3) & 7;
        for(let x=0;x<W;x++){
          const s = (x + rowBlock) % W;
          const g = Math.round((s / (W-1)) * 255);
          testPixel(x, y, g, g, g);
        }
      }
      // 60論理ピクセルごとに目盛り（上端=青 / 下端=緑）
      for(let k=0;k<=8;k++){
        const gx = Math.min(W-1, Math.round(k * (W-1) / 8));
        for(let y=0;y<3;y++)     testPixel(gx, y, 0, 0, 255);
        for(let y=H-3;y<H;y++)   testPixel(gx, y, 0, 255, 0);
      }
      testText('NATIVE 480 x 120', 4, 4, 255, 255, 0);
      break;
    }
    case 'pixelZoom': {
      // 480x120 の論理ピクセルを 8x6 倍して"虫眼鏡"表示。
      // 各論理ピクセルが 8x6 の単色ブロックとして見える。
      const zoomX = 8, zoomY = 6;
      const srcW = W / zoomX;   // 60
      const srcH = H / zoomY;   // 20
      // スクロール（ピンポン）
      const range = W - srcW;                       // 420
      const phase = (f * 1.2) % (range * 2);
      const sx0 = phase < range ? phase : range * 2 - phase;

      for(let j=0;j<srcH;j++){
        for(let i=0;i<srcW;i++){
          const sx = Math.floor(sx0) + i;
          const h = (sx / W) * 360;
          const v = 1 - (j / srcH) * 0.7;
          const [r,g,b] = hsv2rgb(h, 1, v);
          testFillRect(i*zoomX, j*zoomY, zoomX, zoomY, r, g, b);
        }
      }
      testText('PIXEL ZOOM x' + zoomX + '  ORIG ' + srcW + 'x' + srcH, 4, 4, 255, 255, 0);
      break;
    }
    case 'stepWedge': {
      // 量子化ステップを並べてバンディングを可視化。
      // 上段=グレー階調 / 下段=赤階調。
      const counts = [8, 16, 32, 64, 128, 256];
      const halfH = H >> 1;
      const colW  = Math.floor(W / counts.length);
      for(let i=0;i<counts.length;i++){
        const n  = counts[i];
        const bx = i * colW;
        const bw = (i === counts.length-1) ? W - bx : colW;
        for(let x=0;x<bw;x++){
          const lv = Math.floor((x / bw) * n);
          const v  = Math.round((lv / (n-1)) * 255);
          for(let y=0;y<halfH;y++)  testPixel(bx+x, y, v, v, v);
          for(let y=halfH;y<H;y++)  testPixel(bx+x, y, v, 0, 0);
        }
        testText(String(n), bx + 2, halfH - 10, 0, 255, 255);
      }
      // 中央の区切り線
      for(let x=0;x<W;x++) testPixel(x, halfH, 255, 255, 0);
      testText('STEP WEDGE', 4, 4, 255, 255, 0);
      break;
    }
    case 'checker': {
      for(let y=0;y<H;y++){
        for(let x=0;x<W;x++){
          const on = (x+y) & 1;
          const v = on ? 255 : 0;
          testPixel(x, y, v, v, v);
        }
      }
      break;
    }
    case 'crosshatch': {
      testClear(0,0,0);
      for(let x=0;x<W;x+=10) testFillRect(x, 0, 1, H, 255,255,255);
      for(let y=0;y<H;y+=10) testFillRect(0, y, W, 1, 255,255,255);
      testFillRect(W/2-1, 0, 2, H, 255,0,0);
      testFillRect(0, H/2-1, W, 2, 0,255,0);
      testFillRect(0,0,W,1, 0,0,255);
      testFillRect(0,H-1,W,1, 0,0,255);
      testFillRect(0,0,1,H, 0,0,255);
      testFillRect(W-1,0,1,H, 0,0,255);
      break;
    }
    case 'motion': {
      testClear(0,0,0);
      const hx = Math.floor((f*8) % (W + 40)) - 20;
      testFillRect(hx, H/2-8, 16, 16, 255,255,255);
      for(let i=1;i<8;i++){
        const tx = hx - i*20;
        if(tx >= -16 && tx < W){
          const v = Math.max(0, 255 - i*32);
          testFillRect(tx, H/2-6, 12, 12, v, v, v);
        }
      }
      testFillRect(0,0,4,4, 255,0,0);
      testFillRect(W-4,0,4,4, 0,255,0);
      testFillRect(0,H-4,4,4, 0,0,255);
      testFillRect(W-4,H-4,4,4, 255,255,0);
      break;
    }
    case 'fade': {
      const tri = t < phase.dur/2
        ? t/(phase.dur/2)
        : 1 - (t - phase.dur/2)/(phase.dur/2);
      const v = Math.round(tri*255);
      testClear(v,v,v);
      break;
    }
    case 'dots': {
      testClear(0,0,0);
      for(let y=4;y<H;y+=8){
        for(let x=4;x<W;x+=8){
          testFillRect(x, y, 2, 2, 255,255,255);
        }
      }
      break;
    }
  }

  // 進行状況インジケータ（下部）
  const total = TEST_PHASES.length;
  const barW = 6;
  const bx = 4;
  const by = H - 5;
  testFillRect(bx-1, by-1, total*barW+1, 4, 0,0,0);
  for(let i=0;i<total;i++){
    if(i === state.testPhase) testFillRect(bx + i*barW, by, barW-1, 2, 255,255,255);
    else                      testFillRect(bx + i*barW, by, barW-1, 2, 60,60,60);
  }
}

/* ---------------- BOOT SCREEN ---------------- */
/* ===== RISE → PLSE → DSPR boot animation ===== */
const LOGO_Y  = 35;
const LOGO_SC = 5;
const T_RISE_END  = 2.0;   // 0.0–2.0 : 粒子がせり上がりロゴ形成
const T_PLSE_END  = 4.0;   // 2.0–4.0 : ロゴがパルス
const T_DSPR_END  = 5.6;   // 4.0–5.6 : 粒子が拡散して消える
const T_TRANS_END = 7.0;   // 5.6–7.0 : メイン画面へワイプ遷移（追加）

let BOOT_PIX = null;
let bootParticles = [];

function computeBootLogo(){
  if(BOOT_PIX) return BOOT_PIX;
  const saved = new Uint8Array(fb);
  clearFB(0);
  drawTextBigCenter('PAAUDIO', W>>1, LOGO_Y, 3, LOGO_SC, 1);
  BOOT_PIX = [];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(fb[Math.floor(y*SCALE)*PW + Math.floor(x*SCALE)]) BOOT_PIX.push({x,y});
  }
  fb.set(saved);
  return BOOT_PIX;
}
function initBootParticles(){
  const src = computeBootLogo();
  bootParticles = src.map((q,i)=>({
    tx:q.x, ty:q.y, i,
    s1:hash1(i*13+7),
    s2:hash1(i*29+3),
  }));
}

function bootRise(q,t,p){
  const ep = Math.min(1, p/0.8);
  const e  = easeOut(ep);
  const y0 = H + q.s1*80;
  const wob = Math.sin(t*3 + q.i*0.1) * 20 * (1 - e);
  return {
    x: Math.round(lerp(q.tx + wob, q.tx, e)),
    y: Math.round(lerp(y0, q.ty, e))
  };
}
function bootPlse(q,t){
  const d  = Math.hypot(q.tx - W/2, q.ty - H/2);
  const ph = (t*3 - d*0.02) % 2;
  const pulse = ph < 0.3 ? 1 : 0;
  const ramp = Math.min(1, t/0.4);
  const c = 3 + Math.round(pulse * ramp * 3);
  return { x:q.tx, y:q.ty, c };
}
function bootDspr(q,t,p){
  const a = q.s1 * 6.28;
  const r = p * 200;
  return {
    x: q.tx + Math.cos(a)*r,
    y: q.ty + Math.sin(a)*r*0.6,
    c: p < 0.5 ? 3 : 2,
    skip: p > 0.9
  };
}

const BOOT_LINES = [
  'DSP INITIALIZE',
  'MEMORY CHECK',
  'OEL DISPLAY TEST',
  'TUNER INITIALIZE',
  'MEDIA READY',
];
const BOOT_LINES_JP = [
  'DSP初期化',
  'メモリーチェック',
  'OEL表示テスト',
  'チューナー初期化',
  'メディア準備完了',
];

function drawBoot(){
  if(!bootParticles.length) initBootParticles();
  clearFB(0);
  const t = state.bootT;

  if(t < T_RISE_END){
    const p = t / T_RISE_END;
    for(const q of bootParticles){
      const r = bootRise(q, t, p);
      if(r.x<0||r.x>=W||r.y<0||r.y>=H) continue;
      px(r.x, r.y, 3);
    }
    return;
  }
  if(t < T_PLSE_END){
    const dt = t - T_RISE_END;
    for(const q of bootParticles){
      const r = bootPlse(q, dt);
      if(r.x<0||r.x>=W||r.y<0||r.y>=H) continue;
      px(r.x, r.y, r.c||3);
    }
    return;
  }
  if(t < T_DSPR_END){
    const dt = t - T_PLSE_END;
    const p  = Math.min(1, dt / (T_DSPR_END - T_PLSE_END));
    for(const q of bootParticles){
      const r = bootDspr(q, dt, p);
      if(r.skip) continue;
      if(r.x<0||r.x>=W||r.y<0||r.y>=H) continue;
      px(r.x, r.y, r.c||3);
    }
    return;
  }
}

/* ---------------- BOOT → MAIN ワイプ遷移（追加） ---------------- */
function drawBootTransition(){
  const t     = state.bootT - T_DSPR_END;
  const total = T_TRANS_END - T_DSPR_END;
  const raw   = Math.min(1, t / total);

  // まずメイン画面をフルに描画
  clearFB(0);
  drawMain();

  // 上下を黒でマスクして、中央から開いていく
  const ease  = 1 - Math.pow(1 - raw, 3);
  const cy    = H / 2;
  const halfH = ease * (H / 2 + 4);
  const y0    = Math.max(0, Math.floor(cy - halfH));
  const y1    = Math.min(H, Math.ceil (cy + halfH));

  for(let y=0; y<y0; y++){
    for(let x=0; x<W; x++) pset(x, y, 0);
  }
  for(let y=y1; y<H; y++){
    for(let x=0; x<W; x++) pset(x, y, 0);
  }

  // 開いている境界を光らせる
  if(raw < 0.98){
    if(y0 > 0 && y0 < H){
      for(let x=0; x<W; x++){
        px(x, y0, 3);
        if(y0 - 1 >= 0) px(x, y0 - 1, 6);
      }
    }
    if(y1 > 0 && y1 < H){
      for(let x=0; x<W; x++){
        px(x, y1 - 1, 3);
        if(y1 < H)      px(x, y1,     6);
      }
    }
  }

  // 序盤：中央から細い水平ビームが伸びる演出
  if(raw < 0.25){
    const lp        = raw / 0.25;
    const mid       = Math.floor(H / 2);
    const thickness = Math.max(1, Math.floor(lp * 3));
    for(let x=0; x<W; x++){
      for(let k=0; k<thickness; k++){
        px(x, mid - k, k === 0 ? 3 : 6);
        px(x, mid + k, k === 0 ? 3 : 6);
      }
    }
  }
}

/* ---------------- VOLUME OVERLAY ---------------- */
function drawVolumeOverlay(){
  clearFB(0);
  const f = state.frame;
  const a = state.volAnim;
  if(a < 0.35) return;

  const v = state.volume;
  const cx = W/2;
  const cy = 42;

  // Background grid
  for(let y=0;y<H;y+=4){
    for(let x=0;x<W;x+=4){
      if((x+y)%8 === 0) px(x,y,1);
    }
  }

  // Pulsing rings
  for(let i=0;i<4;i++){
    const phase = (f*0.8 + i*22) % 68;
    const r = 12 + phase*1.4;
    const alpha = 1 - phase/68;
    if(alpha < 0.15) continue;
    for(let ang=0; ang<Math.PI*2; ang+=0.16){
      const x = cx + Math.cos(ang)*r;
      const y = cy + Math.sin(ang)*r*0.55;
      const c = alpha > 0.6 ? 3 : 2;
      px(x, y, c);
    }
  }

  const vstr = String(v);
  drawTextBigCenter(vstr, cx, 18, 3, 5, 1);
  drawTextCenter(L('VOLUME','音量'), cx, 4, 2);

  const barX = 30, barY = 82, barW = W - 60, barH = 11;
  const segs = 40;
  const segW = barW / segs;
  for(let i=0;i<segs;i++){
    const on = i < v;
    const bx = Math.floor(barX + i*segW);
    const bw = Math.max(1, Math.ceil(segW) - 1);
    let c = 1;
    if(on){
      c = i < 26 ? 5 : (i < 34 ? 6 : 4);
    }
    for(let x=0;x<bw;x++){
      for(let y=0;y<barH;y++){
        px(bx+x, barY+y, c);
      }
    }
  }
  rectOutline(barX-2, barY-2, barW+4, barH+4, 2);

  // animated waveform
  for(let x=0;x<W;x++){
    const tt = x*0.07 + f*0.18;
    const y = 104 + Math.sin(tt)*2.5 + Math.sin(tt*2.3)*1.2;
    const c = (x+f)%40 < 20 ? 3 : 6;
    px(x, Math.floor(y), c);
  }
}

/* ---------------- SEEK OVERLAY (10秒送り/戻し) ---------------- */
function drawSeekOverlay(){
  clearFB(0);
  if(state.seekAnim < 0.08) return;

  const dir    = state.seekDir;
  const amount = Math.round(state.seekAmount || 10);
  const cx     = W/2;

  // 背景ストライプ
  for(let y=34;y<86;y++){
    for(let x=0;x<W;x++){
      if(((x>>1) + (y>>1)) % 2 === 0) px(x, y, 1);
    }
  }

  // 矢印 + 秒数
  const arrow = dir >= 0 ? '>>' : '<<';
  drawTextBigCenter(arrow + ' ' + amount + 's', cx, 40, 3, 3, 1);
  drawTextCenter(L('SEEK','シーク'), cx, 72, 2);

  // プログレスバー
  const dur = audioEl.duration || 0;
  const cur = audioEl.currentTime || 0;
  if(dur > 0){
    const barW = W - 80;
    const bx   = 40;
    const by   = 90;
    rectOutline(bx-1, by-1, barW+2, 7, 1);
    const pw = Math.max(1, Math.floor(barW * (cur/dur)));
    for(let i=0;i<pw;i++){
      px(bx+i, by,   3);
      px(bx+i, by+1, 3);
      px(bx+i, by+2, 3);
      px(bx+i, by+3, 3);
      px(bx+i, by+4, 3);
    }
    drawTextCenter(fmtTime(cur) + ' / ' + fmtTime(dur), cx, 102, 2);
  }
}

/* ==========================================================================
   11. PRESENT (canvas output)
   ========================================================================== */
const cvs = document.getElementById('cvs');
const gcv = document.getElementById('glow');
const ctx = cvs.getContext('2d');
const gctx = gcv.getContext('2d');
const imgData  = ctx.createImageData(PW, PH);
const gImgData = gctx.createImageData(PW, PH);

function present(){
  // ---- OEL TEST: メインは生RGB、グローは通常と同じパイプライン ----
  if(state.phase === 'run' && state.screen === 'test'){
    ensureTestRGB();
    const d  = imgData.data;
    const gd = gImgData.data;
    const th = THEMES[state.theme % THEMES.length];
    const pal = th.pal;
    const N  = PW*PH;

    for(let i=0;i<N;i++){
      const s = i*3;
      const r = testRGB[s], g = testRGB[s+1], b = testRGB[s+2];

      // グロー残光バッファを通常時と同じロジックで更新
      // （生RGBを「明るさ」相当のパレット値 0〜3 に正規化して蓄積）
      const lum = ((r + g + b) / 765) * 3;
      const gPrev = glowBuf[i] * 0.62;
      glowBuf[i] = lum > gPrev ? lum : gPrev;

      // メインCanvas：生RGB（純色を保つ）
      const o = i*4;
      d[o]   = r;
      d[o+1] = g;
      d[o+2] = b;
      d[o+3] = 255;

      // グローCanvas：通常時とまったく同じ写像
      const gv   = glowBuf[i];
      const gidx = Math.min(pal.length-1, Math.round(gv));
      const gc   = pal[gidx];
      const gk   = Math.min(1, gv/3);
      gd[o]   = gc[0]*gk;
      gd[o+1] = gc[1]*gk;
      gd[o+2] = gc[2]*gk;
      gd[o+3] = 255;
    }

    ctx.putImageData(imgData, 0, 0);
    gctx.putImageData(gImgData, 0, 0);
    return;
  }

  const th = THEMES[state.theme % THEMES.length];
  const pal = th.pal;
  const bright = state.bright;
  const contrast = state.contrast;

  const d  = imgData.data;
  const gd = gImgData.data;
  const N = PW*PH;

  for(let i=0;i<N;i++){
    const cur = fb[i];
    const g = glowBuf[i]*0.62;
    glowBuf[i] = cur > g ? cur : g;
  }

  const brightMul   = 1 + (bright-2)*0.10;
  const contrastMul = 1 + (contrast-2)*0.16;

  for(let i=0;i<N;i++){
    const v = fb[i];
    const c = pal[v] || pal[0];
    let r = c[0], g = c[1], b = c[2];

    r = clamp((r - 128)*contrastMul + 128, 0, 255) * brightMul;
    g = clamp((g - 128)*contrastMul + 128, 0, 255) * brightMul;
    b = clamp((b - 128)*contrastMul + 128, 0, 255) * brightMul;

    const o = i*4;
    d[o] = r; d[o+1] = g; d[o+2] = b; d[o+3] = 255;

    const gv = glowBuf[i];
    const gidx = Math.min(pal.length-1, Math.round(gv));
    const gc = pal[gidx];
    const gk = Math.min(1, gv/3);
    gd[o]   = gc[0]*gk;
    gd[o+1] = gc[1]*gk;
    gd[o+2] = gc[2]*gk;
    gd[o+3] = 255;
  }

  ctx.putImageData(imgData, 0, 0);
  gctx.putImageData(gImgData, 0, 0);
}

/* ==========================================================================
   12. UPDATE / DRAW DISPATCH
   ========================================================================== */
function syncClock(){
  const now = new Date();
  state.clockH = now.getHours();
  state.clockM = now.getMinutes();
  state.clockS = now.getSeconds();
}

function update(dt){
  state.frame++;

  syncClock();          // 常に実時刻へ同期
  /* ---- ソース切替リングのタイマー・追従 ---- */
  if(state.selT > 0){
    state.selT -= dt;
    const k = 1 - Math.exp(-9 * dt);          // 指数追従（連打でなめらかに）
    state.selOffset += (state.selTarget - state.selOffset) * k;
    if(state.selT <= 0){
      state.selT = 0;
      state.selOffset = state.selTarget;      // 終了時にスナップ
    }
  }
  // （残像は present() 内の glowBuf 減衰が自動で処理する）

  if(state.phase === 'boot'){
    state.bootT += dt;
    if(state.bootT > T_TRANS_END){
      state.phase = 'run';
      state.screen = 'main';
    }
  } else if(state.phase === 'shutdown'){
    state.bootT += dt;
    if(state.bootT > 1.2){
      state.phase = 'off';
      state.power = false;
      clearFB(0);
      glowBuf.fill(0);
      if(pwrLedEl) pwrLedEl.classList.remove('on');
    }
  }
  if(state.ejectT > 0){
    state.ejectT -= dt;
    if(state.ejectT <= 0){ state.ejectT = 0; }
  }

  if(state.volAnim > 0){
    state.volAnim -= dt;
    if(state.volAnim < 0) state.volAnim = 0;
  }
  if(state.seekAnim > 0){
    state.seekAnim -= dt;
    if(state.seekAnim < 0) state.seekAnim = 0;
  }

  // ボタン発光色（CYCLE時は毎フレーム更新、固定色でも初期反映されるよう常時呼ぶ）
  applyButtonGlow();
  if(state.trackAnim > 0){
    state.trackAnim -= dt;
    if(state.trackAnim < 0) state.trackAnim = 0;
  }
  if(fadeT > 0){                     // ← これが抜けていた
    fadeT -= dt;
    if(fadeT < 0) fadeT = 0;
  }
  if(state.pageAnim > 0){
    state.pageAnim -= dt;
    if(state.pageAnim < 0) state.pageAnim = 0;
  }

  // ---- SERVICE スタブ / 自己診断の進行 ----
  if(state.stubT > 0){
    state.stubT -= dt;
    if(state.stubT < 0) state.stubT = 0;
  }
  if(state.phase === 'run' && state.screen === 'diag' && state.diagStep < DIAG_ITEMS.length){
    if(state.frame % 8 === 0) state.diagStep++;
  }

  // ---- OEL TEST のフェーズ送り ----
  if(state.phase === 'run' && state.screen === 'test'){
    state.testT += dt;
    const _tp = TEST_PHASES[state.testPhase % TEST_PHASES.length];
    if(state.testT >= _tp.dur){
      state.testT = 0;
      state.testPhase = (state.testPhase + 1) % TEST_PHASES.length;
    }
  }

  if(state.phase === 'run' && state.screen === 'main' && state.demoOn){
    state.demoViz += dt;
    if(state.demoViz > 4){
      state.demoViz = 0;
      state.viz = (state.viz + 1) % (VIZ_FUNCS.length-1);
      // VIZ_FUNCS.length-1 = 8 になるので自動で 0〜7 を巡回
    }
  }

  if(noiseGain && actx){
    let target = 0;
    if(state.source === 'FM' || state.source === 'AM'){
      const sig = signalStrength();
      target = 0.045 * (1 - sig*0.95);
      if(state.source === 'AM') target *= 1.4;
    }
    noiseGain.gain.setTargetAtTime(target, actx.currentTime, 0.08);
    if(noiseFilter){
      noiseFilter.frequency.setTargetAtTime(state.source==='AM'?900:1600, actx.currentTime, 0.15);
    }
  }

  if(mediaLedEl){
    if(isPlaying && !audioEl.paused) mediaLedEl.classList.add('on');
    else mediaLedEl.classList.remove('on');
  }
  if(eqLedEl){
    let active = false;
    for(let i=0;i<13;i++) if(state.eq[i] !== 0){ active = true; break; }
    if(active) eqLedEl.classList.add('on');
    else eqLedEl.classList.remove('on');
  }
  if(demoLedEl){
    if(state.demoOn) demoLedEl.classList.add('on');
    else demoLedEl.classList.remove('on');
  }
}

function draw(){
  if(state.phase === 'off'){
    clearFB(0);
    return;
  }
  if(state.phase === 'boot' || state.phase === 'shutdown'){
    if(state.phase === 'shutdown'){
      clearFB(0);
      const p = clamp(1 - state.bootT/1.2, 0, 1);
      const h = Math.floor(H * p * p);  // ease-in でcollapse加速
      if(h > 0){
        const y = Math.floor((H-h)/2);
        for(let j=0;j<h;j++){
          for(let i=0;i<W;i++){
            const d = Math.abs(j-h/2);
            const v = d < 1 ? 3 : (d < 2 ? 6 : 1);
            pset(i, y+j, v);
          }
        }
        // 水平ストリーク（走査線が横に流れる）
        const midY = Math.floor(H/2);
        for(let i=0;i<W;i++){
          if((i + state.frame*4) % 10 < 5) px(i, midY, 7);
        }
        // 上下の縁を光らせる
        for(let i=0;i<W;i++){
          if(y > 0) px(i, y, 3);
          if(y+h < H) px(i, y+h-1, 3);
        }
      }
      if(p > 0.5) drawTextCenter(L('SEE YOU','さようなら'), W/2, 52, 3, 0);
      return;
    }
    if(state.bootT < T_DSPR_END){
      drawBoot();                // 粒子のせり上がり〜拡散
    } else {
      drawBootTransition();      // メイン画面へワイプ（追加）
    }
    return;
  }
  /* ---- ソース切替アニメーション中は最優先でリングを表示 ---- */
  if(state.selT > 0 && state.screen === 'main'){
    drawSourceRing();
    if(fadeT > 0) drawFadeOverlay();
    return;
  }
  switch(state.screen){
    case 'main':     drawMain(); break;
    case 'menu':     drawMenu(); break;
    case 'eq':       drawEQ(); break;
    case 'position': drawPosition(); break;
    case 'clock':    drawClockScreen(); break;
    case 'test':     drawTest(); break;
    case 'playlist': drawPlaylist(); break;
    /* ---- SERVICE ---- */
    case 'svctest': {
      const t = SVC_TESTS[state.svcId];
      if(t && t.draw) t.draw(state.frame);
      else drawMain();
      break;
    }
    case 'svcstub':  drawSvcStub(); break;
    case 'diag':     drawDiag(); break;
    case 'svcbtn':   drawBtnTest(); break;
    case 'svcspk':   drawSpkTest(); break;
    case 'svcsig':   drawSigGen(); break;
    case 'svcdump':  drawSettingsDump(); break;
    case 'svceeprom':drawEeprom(); break;
    case 'svcerr':   drawErrorLog(); break;
    case 'svcaud':   drawAudioMonitor(); break;
    case 'svcplug':  drawPluginList(); break;
    case 'custom': {
      const sc = state.customScreen && engineScreens.get(state.customScreen.id);
      if(sc && sc.draw){ try{ sc.draw(state.frame); }catch(e){ clearFB(0); drawTextCenter('PLUGIN ERR', W/2, 50, 4); } }
      else drawMain();
      break;
    }
    default:         drawMain();
  }
  if(fadeT > 0) drawFadeOverlay();
  if(state.seekAnim > 0){
    drawSeekOverlay();
  } else if(state.volAnim > 0){
    drawVolumeOverlay();
  }
  if(state.confirmDialog) drawConfirmDialog();   // ← 最後に（最前面）
}
/* ---------------- CONFIRM DIALOG ---------------- */
function drawConfirmDialog(){
  if(!state.confirmDialog) return;
  const d = state.confirmDialog;

  // 暗幕（2px グリッドで半透明風）
  for(let y=0;y<H;y+=2){
    for(let x=0;x<W;x+=2){
      pset(x,   y,   0); pset(x+1, y,   0);
      pset(x,   y+1, 0); pset(x+1, y+1, 0);
    }
  }

  // ダイアログボックス
  const bw = 300, bh = 72;
  const bx = (W - bw) >> 1;
  const by = (H - bh) >> 1;
  fillRect(bx, by, bw, bh, 0);
  rectOutline(bx, by, bw, bh, 3);
  rectOutline(bx+1, by+1, bw-2, bh-2, 1);

  // タイトルバー
  fillRect(bx+1, by+1, bw-2, 12, 2);
  drawText(d.title || 'CONFIRM', bx+6, by+3, 3, 0);

  // メッセージ
  drawTextCenter(d.message, W/2, by+18, 3, 0);
  if(d.subMessage){
    drawTextCenter(d.subMessage.slice(0, 32), W/2, by+28, 2, 0);
  }

  // YES / NO ボタン
  const btnW = 70, btnH = 15;
  const gap = 30;
  const totalW = btnW*2 + gap;
  const sx = (W - totalW) >> 1;
  const sy = by + bh - btnH - 14;

  const labels = [L('YES','はい'), L('NO','いいえ')];
  for(let i=0;i<2;i++){
    const bxx = sx + i*(btnW+gap);
    const sel = i === d.sel;
    const lx = bxx + Math.floor((btnW - tw(labels[i], 0))/2);
    if(sel){
      fillRect(bxx, sy, btnW, btnH, 3);
      drawTextPset(labels[i], lx, sy+4, 0, 0);
    } else {
      rectOutline(bxx, sy, btnW, btnH, 2);
      drawText(labels[i], lx, sy+4, 2, 0);
    }
  }

  // ヒント
  drawTextCenter(L('[LR]SELECT [ENT]OK [ESC]CANCEL',
                   '[←→]選択 [決定]OK [ESC]キャンセル'),
                 W/2, by+bh-9, 1, 0);
}
/* ==========================================================================
   13. INPUT
   ========================================================================== */
function pressKey(k){
  if(k === 'POWER'){
    state.confirmDialog = null;   // ← 追加: 電源操作時はダイアログを閉じる
    if(state.phase === 'off'){
      initAudio();
      if(actx && actx.state === 'suspended') actx.resume();
      state.power = true;
      state.phase = 'boot';
      state.bootT = 0;
      state.screen = 'main';
      state.stack = ['root'];
      state.menuIdx = 0;
      if(pwrLedEl) pwrLedEl.classList.add('on');
      seBt5();                       // ← レトロゲーム起動
    } else {
      stopAllAudio();
      state.phase = 'shutdown';
      state.bootT = 0;
      seSd5();                       // ← レトロゲーム終了
    }
    return;
  }

  if(state.phase !== 'run') return;

  // ---- サービス実テスト中 ----
  if(state.screen === 'svctest'){
    if(k === 'BACK'){
      if(svcEng.active && SVC_TESTS[svcEng.active] && SVC_TESTS[svcEng.active].stop){
        try{ SVC_TESTS[svcEng.active].stop(); }catch(e){}
      }
      svcEng.stop();
      svcEng.active = null;
      fadeTransition(()=>{ state.screen='menu'; });
      return;
    }
    const t = SVC_TESTS[state.svcId];
    if(t && t.onKey) t.onKey(k);
    return;
  }

  // ---- プラグインのカスタム画面がアクティブなら優先 ----
  if(state.customScreen){
    const sc = engineScreens.get(state.customScreen.id);
    // プラグインのonKeyを先に呼ぶ
    if(state._engineKeyHandlers){
      for(const h of state._engineKeyHandlers){ try{ h(k); }catch(e){} }
    }
    if(sc && sc.onKey){ try{ sc.onKey(k); }catch(e){} }
    // BACKで必ず戻れるセーフティ
    if(k === 'BACK'){ state.customScreen = null; state.screen = 'menu'; }
    return;
  }

  // ---- サービス系画面での個別処理 ----
  if(state.screen === 'svcbtn'){
    if(k === 'BACK'){ fadeTransition(()=>{ state.screen='menu'; }); return; }
    btnTestLog.unshift(k);
    if(btnTestLog.length > 20) btnTestLog.pop();
    seNm3();
    return;
  }
  if(state.screen === 'diag'){
    if(k === 'BACK' || k === 'ENTER'){ fadeTransition(()=>{ state.screen='menu'; }); return; }
    return;
  }
  if(state.screen === 'svcstub'){
    if(state.stubT <= 0 || k === 'BACK' || k === 'ENTER'){ fadeTransition(()=>{ state.screen='menu'; }); }
    return;
  }
  if(state.screen === 'svcspk'){
    if(k === 'ENTER'){ spkTestStart((state.spkTestIdx+1) % SPK_CH.length); seNm3(); return; }
    if(k === 'LEFT'){  spkTestStart((state.spkTestIdx-1+SPK_CH.length) % SPK_CH.length); seUp3(); return; }
    if(k === 'RIGHT'){ spkTestStart((state.spkTestIdx+1) % SPK_CH.length); seUp3(); return; }
    if(k === 'UP'){    spkTestStart((state.spkTestIdx-1+SPK_CH.length) % SPK_CH.length); seUp3(); return; }
    if(k === 'DOWN'){  spkTestStart((state.spkTestIdx+1) % SPK_CH.length); seUp3(); return; }
    if(k === 'BACK'){ spkTestStop(); fadeTransition(()=>{ state.screen='menu'; }); return; }
    return;
  }
  if(state.screen === 'svcsig'){
    if(k === 'UP'   && state.sigIdx > 0){ state.sigIdx--; sigStart(); seUp3(); return; }
    if(k === 'DOWN' && state.sigIdx < SIG_LIST.length-1){ state.sigIdx++; sigStart(); seUp3(); return; }
    if(k === 'LEFT'){  state.sigLR = (state.sigLR+2)%3; sigStart(); seDn3(); return; }
    if(k === 'RIGHT'){ state.sigLR = (state.sigLR+1)%3; sigStart(); seUp3(); return; }
    if(k === 'ENTER'){ state.sigLR = (state.sigLR+1)%3; sigStart(); seNm3(); return; }
    if(k === 'BACK'){ sigStop(); fadeTransition(()=>{ state.screen='menu'; }); return; }
    return;
  }
  if(state.screen === 'svcdump'){
    if(k === 'UP'){ state.dumpScroll = Math.max(0, (state.dumpScroll|0)-1); seUp3(); return; }
    if(k === 'DOWN'){ state.dumpScroll = (state.dumpScroll|0)+1; seDn3(); return; }
    if(k === 'BACK'){ fadeTransition(()=>{ state.screen='menu'; }); return; }
    return;
  }
  if(state.screen === 'svceeprom'){
    if(k === 'UP'){ state.eepromScroll = Math.max(0, (state.eepromScroll|0)-1); seUp3(); return; }
    if(k === 'DOWN'){ state.eepromScroll = (state.eepromScroll|0)+1; seDn3(); return; }
    if(k === 'BACK'){ fadeTransition(()=>{ state.screen='menu'; }); return; }
    return;
  }
  if(state.screen === 'svcerr' || state.screen === 'svcaud' || state.screen === 'svcplug'){
    if(k === 'BACK'){ fadeTransition(()=>{ state.screen='menu'; }); return; }
    return;
  }

  // 確認ダイアログ中は ENTER/BACK/方向キーのみ受け付ける
  if(state.confirmDialog){
    if(k === 'ENTER'){ handleEnter(); return; }
    if(k === 'BACK'){  handleBack();  return; }
    if(k === 'LEFT' || k === 'RIGHT' || k === 'UP' || k === 'DOWN'){
      handleDirection(k); return;
    }
    return;   // その他のキーは無視
  }

  // キー種別でSE使い分け
  if(k === 'UP' || k === 'RIGHT')      seUp3();   // 上/次
  else if(k === 'DOWN' || k === 'LEFT') seDn3();   // 下/前
  else                                  seNm3();   // 通常

  switch(k){
    case 'EJECT':
      if(state.source === 'CD' || state.source === 'MD'){
        state.discIn = !state.discIn;
        state.ejectT = 1.0;
        if(state.screen === 'playlist'){
          fadeTransition(()=>{ state.screen = 'main'; });
        }
        if(!state.discIn){
          stopAllAudio();
        } else {
          if(playlist.length) playTrack(0);
        }
      }
      break;

    case 'SOURCE': {
      const order = ['CD','MD','FM','AM','AUX'];
      const i = order.indexOf(state.source);
      const prevSrc = state.source;
      state.source = order[(i+1)%order.length];

      /* ---- リングアニメーション起動 ---- */
      if(state.selT <= 0){
        /* 待機中なら現在のソース位置にオフセットを同期 */
        const curIdx = SRC_RING_LIST.indexOf(prevSrc);
        state.selOffset = curIdx >= 0 ? curIdx : 0;
        state.selTarget = state.selOffset;
      }
      /* 連打時は target だけ進めてタイマーを延長（連続回転） */
      state.selTarget += 1;
      state.selT = 1.0;             // ← 表示秒数（約1秒）

      if(state.source === 'CD' || state.source === 'MD'){
        state.tunerBand = 0;
        if(playlist.length && state.discIn){ playTrack(curTrack<0?0:curTrack); }
      } else {
        stopAllAudio();
        if(state.source === 'FM') state.tunerBand = 0;
        if(state.source === 'AM') state.tunerBand = 1;
      }
      if(state.screen !== 'main'){ state.screen = 'main'; state.stack = ['root']; }
      break;
    }

    case 'BAND':
      // プレイリスト画面中は BAND で抜ける
      if(state.screen === 'playlist'){
        fadeTransition(()=>{ state.screen = 'main'; });
        break;
      }
      // CD/MD でディスクが入っていればプレイリストを開く
      if((state.source === 'CD' || state.source === 'MD') && state.discIn && playlist.length){
        fadeTransition(()=>{ openPlaylist(); });
        break;
      }
      // 従来動作（FM/AM 切替）
      if(state.source === 'FM' || state.source === 'AM'){
        state.tunerBand = 1 - state.tunerBand;
        state.source = state.tunerBand === 0 ? 'FM' : 'AM';
      } else {
        state.tunerBand = 1 - state.tunerBand;
      }
      break;

    case 'MENU':
      if(state.screen === 'menu'){
        fadeTransition(()=>{
          state.screen = 'main';
          state.stack = ['root'];
          state.menuIdx = 0;
        });
      } else {
        fadeTransition(()=>{
          state.stack = ['root'];
          state.menuIdx = 0;
          state.screen = 'menu';
        });
      }
      break;

    case 'DISPLAY':
      if(state.screen === 'main'){
        state.prevPage = state.displayPage;
        state.displayPage = (state.displayPage + 1) % 4;
        state.pageAnim = 0.3;
      } else if(state.screen === 'test'){
        state.screen = 'main';
      }
      break;

    case 'VIZ':
      if(state.screen === 'main'){
        state.viz = (state.viz + 1) % VIZ_FUNCS.length;
        // if not on VIZ page, switch to it
        if(state.displayPage !== 1 && state.displayPage !== 2){
          state.prevPage = state.displayPage;
          state.displayPage = 1;
          state.pageAnim = 0.3;
        }
      }
      break;

    case 'MODE':
      if(state.screen === 'main' || state.screen === 'menu'){
        state.playMode = (state.playMode + 1) % PLAY_MODES.length;
        applyPlayMode();
        scheduleSave();
      }
      break;

    case 'ENTER': handleEnter(); break;
    case 'BACK':  handleBack();  break;

    case 'UP': case 'DOWN': case 'LEFT': case 'RIGHT':
      handleDirection(k);
      break;
  }
  scheduleSave();
}

function togglePlayPause(){
  if(!playlist.length) return;
  if(!audioEl.src){                       // まだ一度も再生していない
    playTrack(curTrack < 0 ? 0 : curTrack);
    return;
  }
  if(audioEl.paused){
    if(actx && actx.state === 'suspended') actx.resume();
    audioEl.play().then(()=>{ isPlaying = true; }).catch(()=>{});
  } else {
    audioEl.pause();
    isPlaying = false;
  }
}

function handleEnter(){
  // 確認ダイアログ表示中は YES/NO を実行
  if(state.confirmDialog){
    const d = state.confirmDialog;
    state.confirmDialog = null;

    // ダイアログを消した状態で現在の画面を一度再描画する。
    // これにより、YES/NO 内で呼ばれる fadeTransition のスナップショットに
    // ダイアログが写り込まない（＝裏でメニューが開くように見える現象を防ぐ）
    draw();

    seNm3();
    if(d.sel === 0){
      if(d.onYes) d.onYes();
    } else {
      if(d.onNo) d.onNo();
    }
    return;
  }

  // プレイリスト画面: ENTER で選択中の項目を実行
  if(state.screen === 'playlist'){
    const items = getPlaylistItems();
    const item = items[state.playlistIdx];
    if(!item) return;
    if(item.type === 'group'){
      // グループを展開（ドリルダウン）
      fadeTransition(()=>{
        state.playlistDrill = { label: item.label, tracks: item.tracks };
        state.playlistIdx = 0;
        state.playlistScroll = 0;
      });
    } else if(item.type === 'playAll'){
      // グループ内全曲をキューに積んで先頭から再生
      const tracks = item.tracks.slice();
      if(!tracks.length) return;
      state.playQueue = tracks;
      state.playQueueLabel = item.label || '';   // ← 追加
      playTrack(tracks[0]);
    } else {
      // 曲を再生（同一曲ならトグル）
      // ドリル中ならキューをグループに設定、ALLビューなら解除
      if(state.playlistDrill){
        state.playQueue = state.playlistDrill.tracks.slice();
        state.playQueueLabel = state.playlistDrill.label || '';  // ← 追加
      } else {
        state.playQueue = [];
        state.playQueueLabel = '';                                // ← 追加
      }
      playTrack(item.trackIdx);
    }
    return;
  }
  if(state.screen === 'main'){
    // CD/MD で曲が入っていれば ENTER = 再生 / 一時停止
    if((state.source === 'CD' || state.source === 'MD') && state.discIn && playlist.length){
      togglePlayPause();
      return;
    }
    fadeTransition(()=>{
      state.stack = ['root'];
      state.menuIdx = 0;
      state.screen = 'menu';
    });
    return;
  }
  if(state.screen === 'eq'){       fadeTransition(()=>{ state.screen = 'menu'; }); return; }
  if(state.screen === 'position'){ fadeTransition(()=>{ state.screen = 'menu'; }); return; }
  if(state.screen === 'clock'){    fadeTransition(()=>{ state.screen = 'menu'; }); return; }
  if(state.screen === 'test'){     state.screen = 'menu'; return; }   // ハードカット（純色→メニュー）

  if(state.screen === 'menu'){
    const m = curMenu();
    const it = m.items[state.menuIdx];
    if(!it) return;

    // ---- VERSION連打でサービスモード ----
    if(it.t === 'info'){
      const v = it.dyn ? it.dyn() : it.val;
      if(v && /FW/i.test(String(v))){
        const now = performance.now();
        if(now - state.lastTapT > 1500) state.versionTaps = 0;
        state.lastTapT = now;
        state.versionTaps++;
        seNm3();
        if(state.versionTaps >= 7){
          state.versionTaps = 0;
          seBt5();
          fadeTransition(()=>{
            state.stack = ['service'];
            state.menuIdx = 0;
            state.screen = 'menu';
          });
        }
        return;
      }
    }

    if(it.t === 'sub'){ enterMenu(it.to); }
    else if(it.t === 'act'){ it.act(); }
    else if(it.t === 'sel'){
      const arr = it.opts;
      state[it.key] = ((state[it.key]|0) + 1) % arr.length;
      applyMenuSideEffect(it);
    } else if(it.t === 'num'){
      let v = (state[it.key]|0) + it.step;
      if(v > it.max) v = it.min;
      state[it.key] = v;
      applyMenuSideEffect(it);
    }
  }
  scheduleSave();
}

function handleBack(){
  // (1) 確認ダイアログ表示中 → BACK は閉じるだけ
  if(state.confirmDialog){
    state.confirmDialog = null;
    return;
  }

  // ---- サービス実テスト中 ----
  if(state.screen === 'svctest'){
    if(svcEng.active && SVC_TESTS[svcEng.active] && SVC_TESTS[svcEng.active].stop){
      try{ SVC_TESTS[svcEng.active].stop(); }catch(e){}
    }
    svcEng.stop();
    svcEng.active = null;
    fadeTransition(function(){ state.screen = 'menu'; });
    return;
  }

  // (2) プレイリスト画面: 通常の戻る動作のみ（確認なし）
  if(state.screen === 'playlist'){
    if(state.playlistDrill){
      fadeTransition(function(){
        state.playlistDrill = null;
        state.playlistIdx = 0;
        state.playlistScroll = 0;
      });
    } else {
      fadeTransition(function(){ state.screen = 'main'; });
    }
    return;
  }

  // (3) メイン（プレイヤー）画面
  //     キュー再生中のみ確認ダイアログ
  if(state.screen === 'main'){
    if(state.playQueue && state.playQueue.length){
      const label = state.playQueueLabel || '';
      state.confirmDialog = {
        title:      L('CONFIRM','確認'),
        message:    L('Return to ALL TRACKS?', '全曲再生に戻しますか?'),
        subMessage: label,
        sel: 0,
        onYes: function(){
          // はい: キュー解除 → メニューへ
          state.playQueue = [];
          state.playQueueLabel = '';
          fadeTransition(function(){
            state.stack = ['root'];
            state.menuIdx = 0;
            state.screen = 'menu';
          });
        },
        onNo: function(){
          // いいえ: 何もしない（メイン画面維持、キュー維持）
        }
      };
      return;
    }
    // キュー無し → 通常通りメニューへ
    fadeTransition(function(){
      state.stack = ['root'];
      state.menuIdx = 0;
      state.screen = 'menu';
    });
    return;
  }

  // (4) その他画面
  if(state.screen === 'eq' || state.screen === 'position'){
    fadeTransition(function(){ state.screen = 'menu'; });
    return;
  }
  if(state.screen === 'test'){ state.screen = 'menu'; return; }
  if(state.screen === 'clock'){ fadeTransition(function(){ state.screen = 'menu'; }); return; }
  // サービス系はすべてメニューへ戻す（音を止める）
  if(state.screen === 'svcspk'){ spkTestStop(); }
  if(state.screen === 'svcsig'){ sigStop(); }
  if(state.screen === 'custom'){ state.customScreen = null; }
  if(state.screen && state.screen.indexOf('svc') === 0 || state.screen === 'diag'){
    fadeTransition(function(){ state.screen = 'menu'; });
    return;
  }
  if(state.screen === 'menu'){ menuBack(); }
}

function handleDirection(k){
  // 確認ダイアログ表示中は YES/NO の切替のみ
  if(state.confirmDialog){
    const h = (k === 'LEFT') ? -1 : (k === 'RIGHT') ? 1 : 0;
    if(h !== 0){
      state.confirmDialog.sel = (state.confirmDialog.sel + h + 2) % 2;
      seNm3();
    }
    return;
  }

  const d = (k === 'UP') ? -1 : (k === 'DOWN') ? 1 : 0;
  const h = (k === 'LEFT') ? -1 : (k === 'RIGHT') ? 1 : 0;

  // プレイリスト画面
  if(state.screen === 'playlist'){
    const items = getPlaylistItems();
    const total = items.length;
    if(d !== 0 && total > 0){
      // 上下ループ
      state.playlistIdx = (state.playlistIdx + d + total) % total;
    }
    if(h !== 0 && !state.playlistDrill){
      // トップレベルでのみビュー切替（既にループ）
      state.playlistView = (state.playlistView + h + 3) % 3;
      state.playlistIdx = 0;
      state.playlistScroll = 0;
    }
    return;
  }

  if(state.screen === 'main'){
    if(h !== 0){
      if(state.source === 'CD' || state.source === 'MD'){
        if(state.discIn && playlist.length){
          nextTrack(h);
        }
      } else if(state.source === 'FM' || state.source === 'AM'){
        tune(h * (state.source === 'FM' ? 0.1 : 9));
      } else {
        changeVolume(h);
      }
    }
    if(d !== 0){
      if(state.source === 'FM' || state.source === 'AM'){
        seek(d);
      } else {
        changeVolume(-d);
      }
    }
    return;
  }

  if(state.screen === 'menu'){
    const m = curMenu();
    const nItems = m.items.length;
    if(d !== 0){
      // 上下ループ
      state.menuIdx = (state.menuIdx + d + nItems) % nItems;
      return;
    }
    const it = m.items[state.menuIdx];
    if(!it) return;
    if(it.t === 'sel'){
      const arr = it.opts;
      const n = arr.length;
      // 左右ループ
      state[it.key] = ((state[it.key]|0) + h + n) % n;
      applyMenuSideEffect(it);
    } else if(it.t === 'num'){
      // 上下限で反対側へループ
      let v = (state[it.key]|0) + h * it.step;
      if(v > it.max) v = it.min;
      if(v < it.min) v = it.max;
      state[it.key] = v;
      applyMenuSideEffect(it);
    } else if(it.t === 'sub'){
      if(h === 1) enterMenu(it.to);
    }
    scheduleSave();
    return;
  }

  if(state.screen === 'test'){
    if(h !== 0){
      state.testT = 0;
      state.testPhase = (state.testPhase + h + TEST_PHASES.length) % TEST_PHASES.length;
      seUp3();
    }
    if(d !== 0){
      state.testT = 0;
      state.testPhase = (state.testPhase + d + TEST_PHASES.length) % TEST_PHASES.length;
      seUp3();
    }
    return;
  }

  if(state.screen === 'eq'){
    if(h !== 0){
      // 13バンドを左右ループ
      state.eqBand = (state.eqBand + h + 13) % 13;
    }
    if(d !== 0){
      // -12 〜 +12 を上下ループ
      const v = state.eq[state.eqBand] - d;
      let nv = v;
      if(nv > 12) nv = -12;
      if(nv < -12) nv = 12;
      setEqBand(state.eqBand, nv);
    }
    scheduleSave();
    return;
  }

  if(state.screen === 'position'){
    if(d !== 0){
      // 4席を上下ループ
      state.position = (state.position + d + 4) % 4;
      scheduleSave();
    }
    return;
  }

  if(state.screen === 'clock'){
    if(h !== 0){
      state.clockH = (state.clockH + h + 24) % 24;
    }
    if(d !== 0){
      state.clockM = (state.clockM - d + 60) % 60;
    }
    scheduleSave();
    return;
  }
}

function applyMenuSideEffect(it){
  if(!it) return;
  if(it.key === 'bass' || it.key === 'mid' || it.key === 'treble'){ applyEqGroups(); }
  else if(it.key === 'preGain'){
    if(preGain && actx) preGain.gain.setTargetAtTime(Math.pow(10, state.preGain/20), actx.currentTime, 0.05);
  }
  else if(it.key === 'eqPreset'){
    const p = EQ_PRESETS[state.eqPreset] || EQ_PRESETS[0];
    for(let i=0;i<13;i++) setEqBand(i, p[i]);
  }
  else if(it.key === 'tunerBand'){
    state.source = state.tunerBand === 0 ? 'FM' : 'AM';
  }
  else if(it.key === 'volume'){ applyVolume(); }
  else if(it.key === 'playMode'){ applyPlayMode(); }
  else if(it.key === 'cdRepeat' || it.key === 'cdRandom'){
    // sync playMode from repeat/random
    for(let i=0;i<PLAY_MODES.length;i++){
      if(PLAY_MODES[i].rep === state.cdRepeat && PLAY_MODES[i].rnd === state.cdRandom){
        state.playMode = i; break;
      }
    }
  }
  else if(it.key === 'position'){
    // nothing extra
  }
}

function applyEqGroups(){
  const p = EQ_PRESETS[state.eqPreset] || EQ_PRESETS[0];
  for(let i=0;i<13;i++){
    let v = p[i];
    if(i <= 3) v += state.bass;
    else if(i <= 8) v += state.mid;
    else v += state.treble;
    setEqBand(i, clamp(v, -12, 12));
  }
}

function tune(delta){
  if(state.source === 'FM'){
    state.fmFreq = clamp(Math.round((state.fmFreq + delta)*10)/10, 76.0, 90.0);
  } else if(state.source === 'AM'){
    state.amFreq = clamp(state.amFreq + delta, 531, 1602);
  }
}
function seek(dir){
  const band = state.tunerBand;
  const list = band===0 ? FM_STATIONS : AM_STATIONS;
  const freq = band===0 ? state.fmFreq : state.amFreq;
  let best = null, bd = 1e9;
  list.forEach(s=>{
    const diff = (s.f - freq) * dir;
    if(diff > 0.05 && diff < bd){ bd = diff; best = s; }
  });
  if(!best) best = dir > 0 ? list[0] : list[list.length-1];
  if(band===0) state.fmFreq = best.f;
  else state.amFreq = best.f;
  state.preset = list.indexOf(best) % 6;
}

/* ---- 長押しシーク用ヘルパ ---- */
const HOLD_DELAY_MS  = 450;   // 長押しと判定するまでの時間
const HOLD_REPEAT_MS = 180;   // 連続シークの間隔（ぱ、ぱ、ぱ…のテンポ）
const SEEK_STEP      = 10;    // 1回あたりの秒数

let holdTimer    = null;
let holdInterval = null;
let holdFired    = false;     // 長押しシークが発動したか

// 長押しシークが有効な状況か？（再生中 / CD・MD / main 画面）
function canLongSeek(){
  return state.phase === 'run' &&
         state.screen === 'main' &&
         (state.source === 'CD' || state.source === 'MD') &&
         state.discIn &&
         playlist.length > 0 &&
         !!audioEl.src &&
         !audioEl.paused;
}

function beginHold(k){
  if(holdTimer)    clearTimeout(holdTimer);
  if(holdInterval) clearInterval(holdInterval);
  holdFired = false;
  holdTimer = setTimeout(()=>{
    holdTimer = null;
    holdFired = true;
    // 最初の1発
    seekBySeconds(k === 'RIGHT' ? SEEK_STEP : -SEEK_STEP);
    // 押しっぱなしで連続
    holdInterval = setInterval(()=>{
      seekBySeconds(k === 'RIGHT' ? SEEK_STEP : -SEEK_STEP);
    }, HOLD_REPEAT_MS);
  }, HOLD_DELAY_MS);
}

function endHold(){
  if(holdTimer){    clearTimeout(holdTimer);    holdTimer = null;    }
  if(holdInterval){ clearInterval(holdInterval); holdInterval = null; }
  const fired = holdFired;
  holdFired = false;
  return fired;
}

/* keyboard */
const KEYMAP = {
  'p':'POWER','e':'EJECT','s':'SOURCE','b':'BAND','m':'MENU','d':'DISPLAY',
  'r':'MODE','v':'VIZ',
  'arrowleft':'LEFT','arrowright':'RIGHT','arrowup':'UP','arrowdown':'DOWN',
  'enter':'ENTER','escape':'BACK','backspace':'BACK',' ':'ENTER'
};

const heldKeyMode = new Map();   // mapped -> 'hold' | 'short'

window.addEventListener('keydown', (e)=>{
  const k = e.key.toLowerCase();
  const mapped = KEYMAP[k];
  if(!mapped) return;
  e.preventDefault();
  if(e.repeat) return;                 // OS キーリピートは無視
  if(heldKeyMode.has(mapped)) return;  // 既に押下中

  if(mapped === 'LEFT' || mapped === 'RIGHT'){
    flashButton(mapped);
    if(canLongSeek()){
      // 長押し判定を開始。短押しは keyup 時に実行
      heldKeyMode.set(mapped, 'hold');
      beginHold(mapped);
    } else {
      // 通常通り即時実行（メニュー操作・FM 選局など）
      heldKeyMode.set(mapped, 'short');
      pressKey(mapped);
    }
  } else {
    heldKeyMode.set(mapped, 'short');
    pressKey(mapped);
    flashButton(mapped);
  }
});

window.addEventListener('keyup', (e)=>{
  const k = e.key.toLowerCase();
  const mapped = KEYMAP[k];
  if(!mapped) return;
  const mode = heldKeyMode.get(mapped);
  if(!mode) return;
  heldKeyMode.delete(mapped);

  if(mode === 'hold'){
    const fired = endHold();
    if(!fired) pressKey(mapped);       // 長押し未発動 → 短押し＝曲送り/戻し
  }
});

function flashButton(k){
  const el = document.querySelector(`button[data-k="${k}"]`);
  if(!el) return;
  el.classList.add('press');
  setTimeout(()=>el.classList.remove('press'), 90);
}

document.querySelectorAll('button.k').forEach(btn=>{
  const k = btn.dataset.k;

  if(k === 'LEFT' || k === 'RIGHT'){
    let mode = null;   // 'hold' | 'short' | null

    btn.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      if(mode) return;
      try{ btn.setPointerCapture(e.pointerId); }catch(_){}
      btn.classList.add('press');

      if(canLongSeek()){
        mode = 'hold';
        beginHold(k);
      } else {
        mode = 'short';
        pressKey(k);
      }
    });

    const finish = ()=>{
      btn.classList.remove('press');
      if(mode === 'hold'){
        const fired = endHold();
        if(!fired) pressKey(k);        // 短押し → 曲送り/戻し
      }
      mode = null;
    };
    btn.addEventListener('pointerup',     finish);
    btn.addEventListener('pointercancel', finish);
    btn.addEventListener('contextmenu',   e=>e.preventDefault());
  } else {
    btn.addEventListener('click', ()=>{
      pressKey(k);
    });
    btn.addEventListener('contextmenu', e=>e.preventDefault());
  }
});

const fileIn = document.getElementById('fileIn');
fileIn.addEventListener('change', (e)=>{
  if(e.target.files && e.target.files.length){
    loadFiles(e.target.files);
    initAudio();
    if(actx && actx.state === 'suspended') actx.resume();
    if(state.power && state.discIn && (state.source==='CD' || state.source==='MD')){
      playTrack(0);
    }
  }
});

window.addEventListener('dragover', e=>{ e.preventDefault(); });
window.addEventListener('drop', e=>{
  e.preventDefault();
  if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
    loadFiles(e.dataTransfer.files);
    initAudio();
    if(state.power && state.discIn) playTrack(0);
  }
});

/* ==========================================================================
   14. LOCAL STORAGE
   ========================================================================== */
const LS_KEY = 'PAAUDIO_PAA100';
const PERSIST_KEYS = [
  'theme','bright','contrast','viz','clock24','scrollOn','demoOn','btnColor',
  'beep','lang','volume','position','eq','eqPreset','bass','mid','treble','preGain',
  'sfMode','loudness','taFL','taFR','taRL','taRR','hpf','lpf','sub','subPhase',
  'lvFL','lvFR','lvRL','lvRR','lvSW','tunerBand','tunerStep','tunerSeek',
  'tunerStereo','tunerLocal','fmFreq','amFreq','preset','cdRepeat','cdRandom',
  'displayPage','playMode'
];

let _saveTimer = null;
function scheduleSave(){
  if(_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveSettings, 250);
}
function saveSettings(){
  try{
    const obj = {};
    PERSIST_KEYS.forEach(k=>{
      const v = state[k];
      obj[k] = Array.isArray(v) ? v.slice() : v;
    });
    localStorage.setItem(LS_KEY, JSON.stringify(obj));
  }catch(e){}
}
function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const obj = JSON.parse(raw);
    PERSIST_KEYS.forEach(k=>{
      if(obj[k] !== undefined && obj[k] !== null){
        const cur = state[k];
        if(Array.isArray(cur) && Array.isArray(obj[k])){
          for(let i=0;i<Math.min(cur.length, obj[k].length);i++){
            const n = Number(obj[k][i]);
            if(isFinite(n)) cur[i] = n;
          }
        } else if(typeof cur === 'number'){
          const n = Number(obj[k]);
          if(isFinite(n)) state[k] = n;
        } else if(typeof cur === 'boolean'){
          state[k] = !!obj[k];
        } else {
          state[k] = obj[k];
        }
      }
    });
  }catch(e){}
}

function applyAllSettings(){
  // apply EQ to audio nodes
  for(let i=0;i<13;i++) setEqBand(i, state.eq[i]|0);
  applyVolume();
  applyPlayMode();
  applyButtonGlow();
  if(preGain && actx) preGain.gain.value = Math.pow(10, state.preGain/20);
}

/* ==========================================================================
   15. MAIN LOOP
   ========================================================================== */
let lastTick = performance.now();
const FPS = 15;
const FRAME_MS = 1000/FPS;

function loop(now){
  requestAnimationFrame(loop);
  const elapsed = now - lastTick;
  if(elapsed < FRAME_MS) return;
  const dt = Math.min(0.25, elapsed/1000);
  lastTick = now;

  update(dt);
  draw();
  present();
}
